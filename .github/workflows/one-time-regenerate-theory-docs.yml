name: One-time regenerate theory docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-regenerate-theory-docs.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf fonts-noto-core fonts-noto-extra
      - name: Rebuild PDF and DOCX from edited HTML
        run: |
          set -e
          files="site/files/between-potential-and-ideal-he-editorial.html site/files/between-potential-and-ideal-en-editorial.html site/files/editorial-tightened/between-potential-and-ideal-tightened-he.html site/files/editorial-tightened/between-potential-and-ideal-tightened-en.html"
          for f in $files; do
            [ -f "$f" ] || continue
            dir=$(dirname "$f")
            pdf="${f%.html}.pdf"
            docx="${f%.html}.docx"
            wkhtmltopdf --enable-local-file-access "$f" "$pdf"
            pandoc "$f" --from=html --to=docx --resource-path="$dir:site:site/figures" --output="$docx"
            echo "rebuilt $pdf and $docx"
          done
      - name: Remove workflow
        run: rm -f .github/workflows/one-time-regenerate-theory-docs.yml
      - name: Commit regenerated docs
        run: |
          git config user.name "Barak Ben Hur via ChatGPT"
          git config user.email "barakbenhur@gmail.com"
          if ! git diff --quiet; then
            git add site/files/*.pdf site/files/*.docx site/files/editorial-tightened/*.pdf site/files/editorial-tightened/*.docx .github/workflows/one-time-regenerate-theory-docs.yml
            git commit -m "Regenerate theory PDF and DOCX files"
            git push
          else
            echo "No changes to commit"
          fi
