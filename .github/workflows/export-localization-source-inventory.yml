name: Export Localization Source Inventory

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "tools/export_localization_source_inventory.py"
      - ".github/workflows/export-localization-source-inventory.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 tools/export_localization_source_inventory.py
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/audits/source-inventory.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record localization source inventory [skip ci]"
          git push
