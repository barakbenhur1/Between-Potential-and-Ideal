name: Stabilize public nav source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stabilize-public-nav-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4
        with:
          ref: bpi-premium-design-stage3
          fetch-depth: 0

      - name: Install final tabbar metrics in shared static CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('site/assets/document-reading-direction-fix.css')
          marker_start = '/* ===== BPI_FINAL_SHARED_TABBAR_METRICS_V1_20260604 ===== */'
          marker_end = '/* ===== /BPI_FINAL_SHARED_TABBAR_METRICS_V1_20260604 ===== */'
          metrics = r'''
/* ===== BPI_FINAL_SHARED_TABBAR_METRICS_V1_20260604 ===== */
html body.public-page .site-header {
  height: 74px !important;
  min-height: 74px !important;
  max-height: 74px !important;
  display: grid !important;
  grid-template-columns: 248px minmax(0, 1080px) 104px !important;
  align-items: center !important;
  justify-content: center !important;
  column-gap: 16px !important;
  padding: 0 clamp(22px, 2.4vw, 36px) !important;
  box-sizing: border-box !important;
  overflow: visible !important;
}
html body.public-page-en .site-header {
  height: 86px !important;
  min-height: 86px !important;
  max-height: 86px !important;
  grid-template-columns: 300px minmax(0, 1040px) 104px !important;
}
html body.public-page .site-header .site-brand {
  grid-column: 1 !important;
  justify-self: start !important;
  width: 248px !important;
  min-width: 248px !important;
  max-width: 248px !important;
  white-space: nowrap !important;
  overflow: visible !important;
}
html body.public-page-en .site-header .site-brand {
  width: 300px !important;
  min-width: 300px !important;
  max-width: 300px !important;
}
html body.public-page .site-header .site-brand a {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;
  font-size: 16px !important;
  font-weight: 800 !important;
  line-height: 1.05 !important;
  letter-spacing: -.025em !important;
  white-space: nowrap !important;
  overflow: visible !important;
  text-overflow: clip !important;
}
html body.public-page .site-header .site-nav {
  grid-column: 2 !important;
  justify-self: center !important;
  width: 100% !important;
  max-width: 1080px !important;
  display: flex !important;
  flex-wrap: wrap !important;
  justify-content: center !important;
  align-items: center !important;
  align-content: center !important;
  text-align: center !important;
  margin-left: auto !important;
  margin-right: auto !important;
  min-width: 0 !important;
  min-height: 44px !important;
  gap: 7px !important;
  overflow: visible !important;
}
html body.public-page-en .site-header .site-nav {
  max-width: 1040px !important;
  gap: 6px !important;
}
html body.public-page .site-header .site-nav a {
  min-height: 36px !important;
  height: 36px !important;
  padding: 8px 13px !important;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;
  font-size: 14px !important;
  font-weight: 700 !important;
  line-height: 1.1 !important;
  letter-spacing: 0 !important;
  box-sizing: border-box !important;
  white-space: nowrap !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
}
html body.public-page-en .site-header .site-nav a {
  padding: 8px 10px !important;
  font-size: 13px !important;
}
html body.public-page .site-header .language-switch {
  grid-column: 3 !important;
  justify-self: end !important;
  width: 104px !important;
  min-width: 104px !important;
  max-width: 104px !important;
  height: 36px !important;
  min-height: 36px !important;
  padding: 8px 13px !important;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;
  font-size: 14px !important;
  font-weight: 700 !important;
  line-height: 1.1 !important;
  box-sizing: border-box !important;
  white-space: nowrap !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
}
@media (max-width: 1180px) {
  html body.public-page .site-header {
    grid-template-columns: 210px minmax(0, 1fr) 92px !important;
  }
  html body.public-page .site-header .site-brand {
    width: 210px !important;
    min-width: 210px !important;
    max-width: 210px !important;
  }
  html body.public-page .site-header .language-switch {
    width: 92px !important;
    min-width: 92px !important;
    max-width: 92px !important;
  }
  html body.public-page .site-header .site-nav a {
    font-size: 13px !important;
    padding: 8px 10px !important;
  }
}
@media (max-width: 860px) {
  html body.public-page .site-header,
  html body.public-page-en .site-header {
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 10px !important;
    padding: 12px 16px !important;
  }
  html body.public-page .site-header .site-brand,
  html body.public-page-en .site-header .site-brand {
    width: auto !important;
    min-width: 0 !important;
    max-width: 100% !important;
  }
}
/* ===== /BPI_FINAL_SHARED_TABBAR_METRICS_V1_20260604 ===== */
'''.strip()
          s = css_path.read_text(encoding='utf-8')
          if marker_start in s and marker_end in s:
              before, rest = s.split(marker_start, 1)
              _, after = rest.split(marker_end, 1)
              s = before.rstrip() + '\n\n' + metrics + '\n' + after.lstrip()
          else:
              s = s.rstrip() + '\n\n' + metrics + '\n'
          css_path.write_text(s, encoding='utf-8')

          version = 'document-reading-direction-fix.css?v=20260604-final-tabbar-metrics-v1'
          paths = [Path('site/index.html'), Path('site/en.html')]
          paths += sorted(Path('site/pages/he').glob('*.html'))
          paths += sorted(Path('site/pages/en').glob('*.html'))
          changed = [str(css_path)]
          for p in paths:
              if not p.exists():
                  continue
              html = p.read_text(encoding='utf-8')
              fixed = re.sub(r'document-reading-direction-fix\.css(?:\?v=[^"\']+)?', version, html)
              if fixed != html:
                  p.write_text(fixed, encoding='utf-8')
                  changed.append(str(p))
          print('\n'.join(changed))
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit static tabbar metrics
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/document-reading-direction-fix.css site/index.html site/en.html site/pages/he site/pages/en
          git commit -m "Stabilize tabbar metrics in shared static CSS"
          git push origin HEAD:bpi-premium-design-stage3

# trigger: 2026-06-04-final-static-tabbar-metrics-v1
