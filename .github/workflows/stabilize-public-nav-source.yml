name: Stabilize public nav source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/stabilize_public_nav_source.py
      - tools/apply_he_mobile_header_asset.py
      - tools/apply_home_black_theme.py
      - tools/apply_google_site_verification.py
      - site/styles.css
      - site/assets/bpi-final-requested-fixes-v1.css
      - site/assets/bpi-final-requested-fixes-v1.js
      - site/assets/bpi-final-requested-fixes-v2.css
      - site/assets/bpi-final-requested-fixes-v2.js
      - site/assets/bpi-header-parity-and-home-divider-v1.css
      - site/assets/bpi-mobile-tabbar-no-scroll-v1.css
      - site/assets/bpi-he-header-match-en-v1.js
      - site/assets/bpi-he-mobile-header-only-v1.css
      - site/assets/bpi-he-mobile-header-only-v2.css
      - site/assets/bpi-home-black-theme-v1.css
      - site/assets/bpi-home-dark-cards-v2.css
      - .github/workflows/stabilize-public-nav-source.yml

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update generated public pages
        run: |
          python3 tools/stabilize_public_nav_source.py
          python3 tools/apply_he_mobile_header_asset.py
          python3 tools/apply_home_black_theme.py
          python3 tools/apply_google_site_verification.py
      - name: Install Cloudflare Web Analytics on public pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          token = 'bd8de7e8a0eb4a1baa17a0c65acdc135'
          snippet = (
              '<!-- Cloudflare Web Analytics -->'
              '<script id="bpi-cloudflare-web-analytics" type="module" '
              'src="https://static.cloudflareinsights.com/beacon.min.js" '
              f'data-cf-beacon=\'{{"token":"{token}"}}\'></script>'
              '<!-- End Cloudflare Web Analytics -->'
          )
          own_block = re.compile(
              r'<!-- Cloudflare Web Analytics -->\s*'
              r'<script\b[^>]*\bid=["\']bpi-cloudflare-web-analytics["\'][^>]*>\s*</script>\s*'
              r'<!-- End Cloudflare Web Analytics -->\s*',
              re.I,
          )

          targets = sorted(Path('site').glob('*.html'))
          targets += sorted(Path('site/pages').rglob('*.html'))

          for path in targets:
              text = path.read_text(encoding='utf-8')
              if '</head>' not in text.lower():
                  continue
              cleaned = own_block.sub('', text)
              match = re.search(r'</head>', cleaned, flags=re.I)
              updated = cleaned[:match.start()] + snippet + cleaned[match.start():]
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
      - name: Verify Cloudflare analytics markup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          token = 'bd8de7e8a0eb4a1baa17a0c65acdc135'
          targets = sorted(Path('site').glob('*.html'))
          targets += sorted(Path('site/pages').rglob('*.html'))
          missing = []
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if '</head>' in text.lower() and (
                  'id="bpi-cloudflare-web-analytics"' not in text or token not in text
              ):
                  missing.append(str(path))
          if missing:
              raise SystemExit('Cloudflare analytics missing from: ' + ', '.join(missing))
          print(f'Cloudflare analytics verified on {len(targets)} public HTML pages')
          PY
      - name: Commit generated HTML
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Install Cloudflare Web Analytics on public pages
          file_pattern: site/*.html site/pages/*/*.html

# trigger: cloudflare-web-analytics-v2
