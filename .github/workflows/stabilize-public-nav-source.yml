name: Stabilize public nav source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/stabilize_public_nav_source.py
      - site/assets/bpi-final-requested-fixes-v1.css
      - site/assets/bpi-final-requested-fixes-v1.js
      - site/assets/bpi-final-requested-fixes-v2.css
      - site/assets/bpi-final-requested-fixes-v2.js
      - site/assets/bpi-header-parity-and-home-divider-v1.css
      - site/assets/bpi-mobile-tabbar-no-scroll-v1.css
      - site/assets/bpi-he-header-match-en-v1.js
      - .github/workflows/stabilize-public-nav-source.yml

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize nav and install final public-page fixes
        run: python3 tools/stabilize_public_nav_source.py
      - name: Commit generated HTML
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Match Hebrew header geometry to English on every public page
          file_pattern: site/index.html site/en.html site/pages/he/*.html site/pages/en/*.html

# trigger: hebrew-header-match-english-v1
