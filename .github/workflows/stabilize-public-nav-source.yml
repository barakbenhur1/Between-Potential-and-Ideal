name: Stabilize public nav source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stabilize-public-nav-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4
        with:
          ref: bpi-premium-design-stage3
          fetch-depth: 0

      - name: Normalize source nav
        run: python3 tools/stabilize_public_nav_source.py

      - name: Verify important page navs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          expected_he = ['בית','תקציר','מילון','מושגים','בינה מלאכותית כעדות','ליבה','מתודולוגיה','עדות','יישום','בינה מלאכותית','קבצים','ביקורת','מקורות']
          expected_en = ['Home','Summary','Glossary','Concepts','AI as Witness','Core','Methodology','Witness','Application','AI','Files','Critique','Sources']
          files = [
            ('site/index.html', expected_he),
            ('site/pages/he/ai-as-witness.html', expected_he),
            ('site/pages/he/files.html', expected_he),
            ('site/pages/he/core.html', expected_he),
            ('site/en.html', expected_en),
            ('site/pages/en/ai-as-witness-en.html', expected_en),
            ('site/pages/en/files-en.html', expected_en),
            ('site/pages/en/core-en.html', expected_en),
          ]
          for path, expected in files:
            text = Path(path).read_text(encoding='utf-8')
            header = re.search(r'<header class="site-header".*?</header>', text, re.S).group(0)
            nav = re.search(r'<nav[^>]*class="site-nav"[^>]*>(.*?)</nav>', header, re.S).group(1)
            labels = [re.sub(r'<.*?>','',m).strip() for m in re.findall(r'<a\b[^>]*>(.*?)</a>', nav, re.S)]
            if labels != expected:
              raise SystemExit(f'{path}\nexpected={expected}\nactual={labels}')
            if len(labels) != len(set(labels)):
              raise SystemExit(f'duplicate labels in {path}: {labels}')
            if header.count('aria-current="page"') != 1:
              raise SystemExit(f'bad active count in {path}')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit normalized source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/en.html site/pages/he site/pages/en
          git commit -m "Normalize public nav source across pages"
          git push origin HEAD:bpi-premium-design-stage3
