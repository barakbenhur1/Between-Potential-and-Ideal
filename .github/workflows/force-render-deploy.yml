name: Force Render deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-render-deploy.yml
      - site/assets/bpi-home-black-theme-v1.css
      - site/assets/bpi-home-dark-cards-v2.css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Trigger Render deploy and capture full result
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: srv-d821i5ugvqtc73d98dtg
          LIVE_URL: https://between-potential-and-ideal.onrender.com
        shell: bash
        run: |
          set -u
          TARGET_SHA="$(git rev-parse HEAD)"
          TARGET_SHORT="${TARGET_SHA:0:7}"
          STATUS=""
          RESPONSE=""
          HTTP_CODE=""
          METHOD=""

          HOOK_URL="${RENDER_DEPLOY_HOOK_URL:-${RENDER_DEPLOY_HOOK:-}}"
          API_TOKEN="${RENDER_API_KEY:-${RENDER_API_TOKEN:-}}"

          call_and_capture() {
            local output
            output="$(curl --silent --show-error --location --connect-timeout 20 --max-time 60 --write-out $'\n%{http_code}' "$@" 2>&1)"
            CURL_EXIT=$?
            HTTP_CODE="$(printf '%s\n' "$output" | tail -n 1)"
            RESPONSE="$(printf '%s\n' "$output" | sed '$d')"
            return 0
          }

          CURL_EXIT=0
          if [[ -n "$HOOK_URL" ]]; then
            METHOD="deploy_hook"
            call_and_capture --request POST "$HOOK_URL"
            if [[ "$CURL_EXIT" -eq 0 && "$HTTP_CODE" =~ ^2 ]]; then STATUS="deploy_hook_accepted"; else STATUS="deploy_hook_failed"; fi
          elif [[ -n "$API_TOKEN" ]]; then
            METHOD="render_api"
            call_and_capture --request POST --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" --header "Authorization: Bearer ${API_TOKEN}" --header "Content-Type: application/json" --data "{\"clearCache\":\"clear\",\"commitId\":\"${TARGET_SHA}\"}"
            if [[ "$CURL_EXIT" -eq 0 && "$HTTP_CODE" =~ ^2 ]]; then STATUS="render_api_accepted"; else STATUS="render_api_failed"; fi
          else
            METHOD="none"
            STATUS="missing_render_secret"
            RESPONSE="No repository or environment secret named RENDER_DEPLOY_HOOK_URL, RENDER_DEPLOY_HOOK, RENDER_API_KEY, or RENDER_API_TOKEN is available to this workflow."
          fi

          LIVE_HTML="$(curl --silent --show-error --location --max-time 30 "${LIVE_URL}/" 2>&1 || true)"
          LIVE_BUILD="$(curl --silent --show-error --location --max-time 30 "${LIVE_URL}/build-info.json" 2>&1 || true)"
          LIVE_THEME="$(curl --silent --show-error --location --max-time 30 "${LIVE_URL}/assets/bpi-home-black-theme-v1.css?v=20260606-home-black-theme-v1" 2>&1 || true)"
          LIVE_CARDS="$(curl --silent --show-error --location --max-time 30 "${LIVE_URL}/assets/bpi-home-dark-cards-v2.css?v=20260606-home-dark-cards-v2" 2>&1 || true)"

          if printf '%s' "$LIVE_HTML" | grep -q 'bpi-home-black-theme'; then LIVE_HAS_BLACK_THEME=true; else LIVE_HAS_BLACK_THEME=false; fi
          if printf '%s' "$LIVE_HTML" | grep -q 'בינה מלאכותית כעדות'; then LIVE_HAS_CURRENT_NAV=true; else LIVE_HAS_CURRENT_NAV=false; fi
          if printf '%s' "$LIVE_THEME" | grep -q 'bpi-home-dark-cards-v2.css'; then LIVE_THEME_IMPORTS_DARK_CARDS=true; else LIVE_THEME_IMPORTS_DARK_CARDS=false; fi
          if printf '%s' "$LIVE_CARDS" | grep -q 'design-prompt-theme.bpi-home-page'; then LIVE_DARK_CARDS_CSS_AVAILABLE=true; else LIVE_DARK_CARDS_CSS_AVAILABLE=false; fi

          export STATUS RESPONSE HTTP_CODE METHOD TARGET_SHA TARGET_SHORT LIVE_BUILD LIVE_HAS_BLACK_THEME LIVE_HAS_CURRENT_NAV LIVE_THEME_IMPORTS_DARK_CARDS LIVE_DARK_CARDS_CSS_AVAILABLE
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          b=lambda n: os.environ.get(n,'').lower()=='true'
          payload={
            'status':os.environ.get('STATUS',''),
            'method':os.environ.get('METHOD',''),
            'http_code':os.environ.get('HTTP_CODE',''),
            'target_commit':os.environ.get('TARGET_SHA',''),
            'target_short_commit':os.environ.get('TARGET_SHORT',''),
            'service_id':'srv-d821i5ugvqtc73d98dtg',
            'recorded_at_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
            'response':os.environ.get('RESPONSE','')[:8000],
            'live_has_black_theme':b('LIVE_HAS_BLACK_THEME'),
            'live_has_current_navigation':b('LIVE_HAS_CURRENT_NAV'),
            'live_theme_imports_dark_cards':b('LIVE_THEME_IMPORTS_DARK_CARDS'),
            'live_dark_cards_css_available':b('LIVE_DARK_CARDS_CSS_AVAILABLE'),
            'live_build_info_response':os.environ.get('LIVE_BUILD','')[:8000],
          }
          Path('site/render-deploy-status.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit deploy diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/render-deploy-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record homepage dark-theme deployment verification"
          git push origin HEAD:main

# diagnostic-trigger: 2026-06-06-v3
