name: Force Render deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-render-deploy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: force-render-public-beta-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Trigger Render deploy and verify public beta routes
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: srv-d821i5ugvqtc73d98dtg
          LIVE_URL: https://between-potential-and-ideal.onrender.com
        shell: bash
        run: |
          set -u
          TARGET_SHA="$(git rev-parse HEAD)"
          TARGET_SHORT="${TARGET_SHA:0:7}"
          STATUS=""
          RESPONSE=""
          HTTP_CODE=""
          METHOD=""

          HOOK_URL="${RENDER_DEPLOY_HOOK_URL:-${RENDER_DEPLOY_HOOK:-}}"
          API_TOKEN="${RENDER_API_KEY:-${RENDER_API_TOKEN:-}}"

          call_and_capture() {
            local output
            output="$(curl --silent --show-error --location --connect-timeout 20 --max-time 60 --write-out $'\n%{http_code}' "$@" 2>&1)"
            CURL_EXIT=$?
            HTTP_CODE="$(printf '%s\n' "$output" | tail -n 1)"
            RESPONSE="$(printf '%s\n' "$output" | sed '$d')"
            return 0
          }

          CURL_EXIT=0
          if [[ -n "$HOOK_URL" ]]; then
            METHOD="deploy_hook"
            call_and_capture --request POST "$HOOK_URL"
            if [[ "$CURL_EXIT" -eq 0 && "$HTTP_CODE" =~ ^2 ]]; then STATUS="deploy_hook_accepted"; else STATUS="deploy_hook_failed"; fi
          elif [[ -n "$API_TOKEN" ]]; then
            METHOD="render_api"
            call_and_capture --request POST --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" --header "Authorization: Bearer ${API_TOKEN}" --header "Content-Type: application/json" --data "{\"clearCache\":\"clear\",\"commitId\":\"${TARGET_SHA}\"}"
            if [[ "$CURL_EXIT" -eq 0 && "$HTTP_CODE" =~ ^2 ]]; then STATUS="render_api_accepted"; else STATUS="render_api_failed"; fi
          else
            METHOD="none"
            STATUS="missing_render_secret"
            RESPONSE="No repository secret named RENDER_DEPLOY_HOOK_URL, RENDER_DEPLOY_HOOK, RENDER_API_KEY, or RENDER_API_TOKEN is available."
          fi

          # Give Render a bounded opportunity to publish, then capture the actual live result.
          LIVE_HOME=""
          LIVE_BUILD=""
          LIVE_TLH=""
          LIVE_QYA=""
          LIVE_TLH_DOC=""
          LIVE_QYA_DOC=""
          for attempt in $(seq 1 24); do
            LIVE_HOME="$(curl --silent --show-error --location --max-time 30 "${LIVE_URL}/" 2>&1 || true)"
            LIVE_BUILD="$(curl --silent --show-error --location --max-time 30 "${LIVE_URL}/build-info.json" 2>&1 || true)"
            LIVE_TLH="$(curl --silent --show-error --location --max-time 30 "${LIVE_URL}/tlh.html" 2>&1 || true)"
            LIVE_QYA="$(curl --silent --show-error --location --max-time 30 "${LIVE_URL}/qya.html" 2>&1 || true)"
            LIVE_TLH_DOC="$(curl --silent --show-error --location --max-time 30 "${LIVE_URL}/files/tlh/between-potential-and-ideal-tlh.html" 2>&1 || true)"
            LIVE_QYA_DOC="$(curl --silent --show-error --location --max-time 30 "${LIVE_URL}/files/qya/between-potential-and-ideal-qya.html" 2>&1 || true)"
            if printf '%s' "$LIVE_TLH" | grep -q 'PUBLIC BETA' \
              && printf '%s' "$LIVE_QYA" | grep -q 'PUBLIC BETA' \
              && printf '%s' "$LIVE_TLH_DOC" | grep -q 'linguistic review ongoing' \
              && printf '%s' "$LIVE_QYA_DOC" | grep -q 'linguistic review ongoing'; then
              break
            fi
            sleep 10
          done

          if printf '%s' "$LIVE_HOME" | grep -q 'localization-public-beta-links:start'; then LIVE_HOME_HAS_BETA_LINKS=true; else LIVE_HOME_HAS_BETA_LINKS=false; fi
          if printf '%s' "$LIVE_TLH" | grep -q 'PUBLIC BETA'; then LIVE_TLH_OK=true; else LIVE_TLH_OK=false; fi
          if printf '%s' "$LIVE_QYA" | grep -q 'PUBLIC BETA'; then LIVE_QYA_OK=true; else LIVE_QYA_OK=false; fi
          if printf '%s' "$LIVE_TLH_DOC" | grep -q 'linguistic review ongoing'; then LIVE_TLH_DOC_OK=true; else LIVE_TLH_DOC_OK=false; fi
          if printf '%s' "$LIVE_QYA_DOC" | grep -q 'linguistic review ongoing'; then LIVE_QYA_DOC_OK=true; else LIVE_QYA_DOC_OK=false; fi

          export STATUS RESPONSE HTTP_CODE METHOD TARGET_SHA TARGET_SHORT LIVE_BUILD LIVE_HOME_HAS_BETA_LINKS LIVE_TLH_OK LIVE_QYA_OK LIVE_TLH_DOC_OK LIVE_QYA_DOC_OK
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          boolean=lambda name: os.environ.get(name,'').lower()=='true'
          payload={
            'status':os.environ.get('STATUS',''),
            'method':os.environ.get('METHOD',''),
            'http_code':os.environ.get('HTTP_CODE',''),
            'target_commit':os.environ.get('TARGET_SHA',''),
            'target_short_commit':os.environ.get('TARGET_SHORT',''),
            'service_id':'srv-d821i5ugvqtc73d98dtg',
            'recorded_at_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
            'response':os.environ.get('RESPONSE','')[:8000],
            'live_home_has_beta_links':boolean('LIVE_HOME_HAS_BETA_LINKS'),
            'live_tlh_gateway_ok':boolean('LIVE_TLH_OK'),
            'live_qya_gateway_ok':boolean('LIVE_QYA_OK'),
            'live_tlh_document_ok':boolean('LIVE_TLH_DOC_OK'),
            'live_qya_document_ok':boolean('LIVE_QYA_DOC_OK'),
            'live_build_info_response':os.environ.get('LIVE_BUILD','')[:8000],
          }
          payload['production_verified']=all([
            payload['live_home_has_beta_links'],
            payload['live_tlh_gateway_ok'],
            payload['live_qya_gateway_ok'],
            payload['live_tlh_document_ok'],
            payload['live_qya_document_ok'],
          ])
          Path('site/render-deploy-status.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit deploy diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/render-deploy-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record public beta production deployment verification"
          git push origin HEAD:main

# diagnostic-trigger: 2026-06-12-public-beta-v1
