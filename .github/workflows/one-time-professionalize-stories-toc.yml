# Push trigger disabled by BPI ideal fixer to prevent one-time workflow regressions.
name: One-time professionalize Stories Before Thought TOC

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  professionalize-toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install converters
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf fonts-noto-core fonts-noto-extra fonts-noto-color-emoji

      - name: Replace story appendix TOC with professional layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re
          import subprocess

          CSS_ID = 'bpi-professional-story-toc-v1'
          CSS = r'''
<style id="bpi-professional-story-toc-v1">
.story-toc-page.professional-story-toc{
  min-height:250mm!important;
  page-break-after:always!important;
  break-after:page!important;
  box-sizing:border-box!important;
  padding:54px 58px!important;
  background:
    radial-gradient(circle at 14% 12%,rgba(0,167,183,.08),transparent 18rem),
    radial-gradient(circle at 90% 6%,rgba(242,142,43,.12),transparent 18rem),
    linear-gradient(135deg,#fffdf6,#fffaf0 62%,#f7ead4)!important;
  border-inline-start:8px solid var(--gold,#c5791d)!important;
}
.story-toc-page.professional-story-toc .toc-eyebrow{
  color:var(--gold,#c5791d)!important;
  font-weight:900!important;
  letter-spacing:.12em!important;
  text-transform:uppercase!important;
  font-size:.82rem!important;
  margin:0 0 .45rem!important;
}
.story-toc-page.professional-story-toc h2{
  color:#0A3A68!important;
  font-size:clamp(2.3rem,4.6vw,4rem)!important;
  line-height:1.05!important;
  margin:0!important;
  padding:0 0 .55rem!important;
  border-bottom:1px solid rgba(10,58,104,.15)!important;
}
.story-toc-page.professional-story-toc .toc-lead{
  max-width:64ch!important;
  margin:.85rem 0 1.45rem!important;
  color:#425468!important;
  font-size:clamp(1rem,1.7vw,1.18rem)!important;
  line-height:1.65!important;
  font-style:normal!important;
  font-weight:500!important;
}
.story-toc-pro-list{
  list-style:none!important;
  counter-reset:storytoc!important;
  display:grid!important;
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  gap:10px 14px!important;
  margin:0!important;
  padding:0!important;
}
.story-toc-pro-row{
  counter-increment:storytoc!important;
  margin:0!important;
  padding:0!important;
  break-inside:avoid!important;
  page-break-inside:avoid!important;
}
.story-toc-pro-row a{
  display:grid!important;
  grid-template-columns:auto minmax(0,1fr) auto!important;
  align-items:center!important;
  gap:.72rem!important;
  min-height:52px!important;
  padding:10px 13px!important;
  border:1px solid rgba(10,58,104,.14)!important;
  border-radius:18px!important;
  background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,250,240,.96))!important;
  color:#0A3A68!important;
  text-decoration:none!important;
  box-shadow:0 8px 22px rgba(10,58,104,.055)!important;
}
.story-toc-pro-row a:hover{
  transform:translateY(-1px);
  box-shadow:0 12px 28px rgba(10,58,104,.1)!important;
}
.story-toc-pro-row .toc-number{
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  width:2.35rem!important;
  height:2.35rem!important;
  border-radius:999px!important;
  background:#fff7e8!important;
  border:1px solid rgba(184,121,38,.28)!important;
  color:var(--gold,#c5791d)!important;
  font-size:.86rem!important;
  font-weight:900!important;
  font-variant-numeric:tabular-nums!important;
}
.story-toc-pro-row .toc-title{
  min-width:0!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  color:#102033!important;
  font-size:clamp(1.02rem,1.65vw,1.18rem)!important;
  line-height:1.35!important;
  font-weight:800!important;
}
.story-toc-pro-row .toc-marker{
  color:#b87926!important;
  opacity:.75!important;
  font-weight:900!important;
}
html[dir="rtl"] .story-toc-page.professional-story-toc,
.story-toc-page.professional-story-toc[dir="rtl"]{
  direction:rtl!important;
  text-align:right!important;
  border-inline-start:0!important;
  border-inline-end:8px solid var(--gold,#c5791d)!important;
}
html[dir="rtl"] .story-toc-pro-row a,
.story-toc-page[dir="rtl"] .story-toc-pro-row a{
  grid-template-columns:auto minmax(0,1fr) auto!important;
}
@media(max-width:760px){
  .story-toc-page.professional-story-toc{padding:34px 24px!important;}
  .story-toc-pro-list{grid-template-columns:1fr!important;}
}
@media print{
  .story-toc-page.professional-story-toc{
    padding:18mm 16mm!important;
    background:#fffaf0!important;
    box-shadow:none!important;
  }
  .story-toc-page.professional-story-toc h2{font-size:26pt!important;}
  .story-toc-page.professional-story-toc .toc-lead{font-size:11.5pt!important;margin-bottom:6mm!important;}
  .story-toc-pro-list{grid-template-columns:1fr 1fr!important;gap:3mm 4mm!important;}
  .story-toc-pro-row a{min-height:11mm!important;padding:2.6mm 3.2mm!important;border-radius:5mm!important;box-shadow:none!important;}
  .story-toc-pro-row .toc-number{width:8mm!important;height:8mm!important;font-size:8.5pt!important;}
  .story-toc-pro-row .toc-title{font-size:10.5pt!important;line-height:1.25!important;}
}
</style>
'''

          HE_SUBTITLE_BAD = 'סיפורים שסיפרתי לאמי לפני השינה'
          HE_SUBTITLE_GOOD = 'סיפורים שסיפרתי לאימי לפני השינה'

          def is_hebrew(text):
              return 'lang="he"' in text or 'dir="rtl"' in text or 'תוכן עניינים' in text

          def ensure_css(text):
              text = re.sub(r'<style id="bpi-professional-story-toc-v1">.*?</style>\s*', '', text, flags=re.S)
              if '</head>' in text:
                  return text.replace('</head>', CSS + '\n</head>', 1)
              return CSS + text

          def build_section(items, he=True):
              if he:
                  eyebrow = 'נספחים ספרותיים'
                  title = 'תוכן עניינים'
                  lead = 'מפת קריאה נקייה לכל הסיפורים באוסף. כל שורה מובילה ישירות לסיפור, בלי להפוך את הרשימה לעומס חזותי.'
                  marker = '↗'
                  dir_attr = ' dir="rtl"'
              else:
                  eyebrow = 'Literary appendices'
                  title = 'Contents'
                  lead = 'A clean reading map for the stories in this collection. Each row leads directly to its story without turning the list into visual noise.'
                  marker = '↗'
                  dir_attr = ' dir="ltr"'
              lis = []
              for i, (href, text) in enumerate(items, 1):
                  safe_href = html.escape(href, quote=True)
                  safe_text = html.escape(text.strip())
                  lis.append(
                      '<li class="story-toc-pro-row">'
                      f'<a href="{safe_href}">'
                      f'<span class="toc-number">{i:02d}</span>'
                      f'<span class="toc-title">{safe_text}</span>'
                      f'<span class="toc-marker" aria-hidden="true">{marker}</span>'
                      '</a></li>'
                  )
              return (
                  f'<section class="page story-toc-page professional-story-toc" id="table-of-contents"{dir_attr} '
                  'style="min-height:250mm;page-break-after:always;break-after:page;box-sizing:border-box;">'
                  f'<div class="toc-eyebrow">{html.escape(eyebrow)}</div>'
                  f'<h2>{html.escape(title)}</h2>'
                  f'<p class="toc-lead">{html.escape(lead)}</p>'
                  '<ol class="story-toc-pro-list">'
                  + ''.join(lis) +
                  '</ol></section>'
              )

          def patch_html(path, text):
              original = text
              text = text.replace(HE_SUBTITLE_BAD, HE_SUBTITLE_GOOD)
              m = re.search(r'<section\b[^>]*class="[^"]*story-toc-page[^"]*"[^>]*>.*?</section>', text, flags=re.S|re.I)
              if not m:
                  return text, False
              old = m.group(0)
              items = re.findall(r'<a\b[^>]*href="([^"]+)"[^>]*>(.*?)</a>', old, flags=re.S|re.I)
              clean_items = []
              for href, label in items:
                  label = re.sub(r'<[^>]+>', '', label)
                  label = html.unescape(re.sub(r'\s+', ' ', label)).strip()
                  if href.startswith('#') and label:
                      clean_items.append((href, label))
              if not clean_items:
                  return text, text != original
              new_section = build_section(clean_items, he=is_hebrew(text))
              text = text[:m.start()] + new_section + text[m.end():]
              text = ensure_css(text)
              return text, text != original

          changed = []
          regenerated = []
          for path in sorted(Path('site').rglob('*.html')):
              if 'stories-before-thought' not in path.name and 'appendices' not in str(path):
                  continue
              data = path.read_text(encoding='utf-8', errors='ignore')
              if 'story-toc-page' not in data:
                  continue
              new, did = patch_html(path, data)
              if did:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          for item in changed:
              html_path = Path(item)
              pdf = html_path.with_suffix('.pdf')
              docx = html_path.with_suffix('.docx')
              if pdf.exists():
                  try:
                      subprocess.run(['wkhtmltopdf','--enable-local-file-access',str(html_path),str(pdf)], check=True)
                      regenerated.append(str(pdf))
                  except Exception as e:
                      print('PDF regeneration failed:', pdf, e)
              if docx.exists():
                  try:
                      subprocess.run(['pandoc',str(html_path),'--from=html','--to=docx',f'--resource-path={html_path.parent}:site:site/figures','--output',str(docx)], check=True)
                      regenerated.append(str(docx))
                  except Exception as e:
                      print('DOCX regeneration failed:', docx, e)

          report = Path('docs/stories-before-thought-professional-toc.md')
          report.parent.mkdir(parents=True, exist_ok=True)
          lines = ['# Stories Before Thought professional TOC', '', 'Updated the story appendix table of contents to match the cleaner document quality used in the theory files.', '', '## Changed HTML files']
          lines += [f'- `{p}`' for p in changed] if changed else ['- No HTML files changed.']
          lines += ['', '## Regenerated outputs']
          lines += [f'- `{p}`' for p in regenerated] if regenerated else ['- No same-stem PDF/DOCX outputs regenerated.']
          report.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Remove workflow
        run: rm -f .github/workflows/one-time-professionalize-stories-toc.yml

      - name: Commit professional TOC fix
        run: |
          git config user.name "Barak Ben Hur via ChatGPT"
          git config user.email "barakbenhur@gmail.com"
          if ! git diff --quiet; then
            git add site docs/stories-before-thought-professional-toc.md .github/workflows/one-time-professionalize-stories-toc.yml
            git commit -m "Professionalize Stories Before Thought table of contents"
            git push
          else
            echo "No changes to commit"
          fi
