name: Fix segment 200 regression once

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/fix-segment-200-regression-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Restore unaffected strings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = next(Path('localization/sources/tlh/between-potential-and-ideal').glob('200-*.md'))
          text = path.read_text(encoding='utf-8')
          text = text.replace("v25_'ay'vam_recursive-edge.png", 'v25_chapter_recursive-edge.png')
          text = text.replace('literal chenDaj.', 'literal identity.')
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-segment-200-regression-once.yml
          git diff --check
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'Restore segment 200 unaffected strings'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
