name: Expose Localization Public Beta

on:
  push:
    branches:
      - localization-release-resolved
    paths:
      - site/tlh.html
      - site/qya.html
      - site/files/tlh/**
      - site/files/qya/**
      - localization/beta-release-manifest.json
      - tools/expose_localization_beta.py
      - .github/workflows/expose-localization-public-beta.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expose-localization-public-beta
  cancel-in-progress: true

jobs:
  expose-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Expose localized editions without a homepage beta banner
        run: python3 tools/expose_localization_beta.py
      - name: Verify entry points, language menu, and localized images
        run: |
          set -euo pipefail
          test -s site/tlh.html
          test -s site/qya.html
          ! grep -q "localization-public-beta-links:start" site/en.html
          ! grep -q "localization-public-beta-links:start" site/index.html
          for page in site/index.html site/en.html; do
            grep -q 'class="bpi-language-menu"' "$page"
            grep -q 'class="bpi-language-menu-icon"' "$page"
            grep -q 'href="/index.html"' "$page"
            grep -q 'href="/en.html"' "$page"
            grep -q 'href="/tlh.html"' "$page"
            grep -q 'href="/qya.html"' "$page"
          done
          grep -q "tlh.html" site/sitemap.xml
          grep -q "qya.html" site/sitemap.xml
          python3 tools/audit_images_exist.py
      - name: Commit public entry points and normalized packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/en.html \
            site/index.html \
            site/sitemap.xml \
            site/files/tlh/between-potential-and-ideal-tlh.html \
            site/files/tlh/between-potential-and-ideal-tlh.md \
            site/files/qya/between-potential-and-ideal-qya.html \
            site/files/qya/between-potential-and-ideal-qya.md \
            localization/beta-release-manifest.json
          if git diff --cached --quiet; then
            echo "Localized entry points and packages are current."
            exit 0
          fi
          git commit -m "Expose four-language menu without beta banner"
          git push origin HEAD:localization-release-resolved
