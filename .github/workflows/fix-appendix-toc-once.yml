name: Fix appendix story TOC once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-appendix-toc-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-appendix-toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Map appendix TOC thumbnails from story sections and pin layout to language side
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re

          TARGETS = [
            (Path('site/files/appendices/stories-before-thought-hebrew-rtl.html'), 'rtl'),
            (Path('site/files/appendices/stories-before-thought-english.html'), 'ltr'),
          ]

          STYLE_ID = 'v118-appendix-story-toc-side-pinned-inline-layout'
          CSS = f'''
          <style id="{STYLE_ID}">
          /* V118 — appendix story TOC thumbnails: side-pinned by language, image and title locked on one row. */
          .story-toc-page{{text-align:start!important;}}
          html[dir="rtl"] .story-toc-page{{text-align:right!important;}}
          html[dir="ltr"] .story-toc-page{{text-align:left!important;}}
          .story-toc-page h2,.story-toc-page>p{{text-align:inherit!important;}}
          .story-toc-page .story-toc-clean-list{{display:block!important;width:min(620px,100%)!important;max-width:620px!important;margin-block:24px 0!important;padding:0!important;text-align:inherit!important;direction:inherit!important;}}
          html[dir="rtl"] .story-toc-page .story-toc-clean-list{{margin-right:0!important;margin-left:auto!important;text-align:right!important;direction:rtl!important;}}
          html[dir="ltr"] .story-toc-page .story-toc-clean-list{{margin-left:0!important;margin-right:auto!important;text-align:left!important;direction:ltr!important;}}
          .story-toc-page .story-toc-row{{display:block!important;margin:0!important;padding:.48rem 0!important;border-block-start:1px solid rgba(197,121,29,.22)!important;text-align:inherit!important;direction:inherit!important;}}
          .story-toc-page .story-toc-row:first-child{{border-block-start:0!important;}}
          .story-toc-page .story-toc-entry{{display:inline-flex!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;width:auto!important;max-width:100%!important;min-height:42px!important;padding:0!important;margin:0!important;color:#08737a!important;text-align:inherit!important;direction:inherit!important;text-decoration:none!important;vertical-align:middle!important;}}
          html[dir="rtl"] .story-toc-page .story-toc-entry{{flex-direction:row!important;}}
          html[dir="ltr"] .story-toc-page .story-toc-entry{{flex-direction:row!important;}}
          .story-toc-page .story-toc-thumb{{display:block!important;flex:0 0 58px!important;width:58px!important;min-width:58px!important;height:40px!important;object-fit:cover!important;object-position:center center!important;border-radius:8px!important;border:1px solid rgba(10,58,104,.13)!important;background:#fffaf0!important;box-shadow:0 3px 9px rgba(20,40,60,.07)!important;margin:0!important;}}
          .story-toc-page .story-toc-title{{display:block!important;min-width:0!important;color:#08737a!important;font-size:22px!important;line-height:1.25!important;font-weight:700!important;text-align:inherit!important;direction:inherit!important;white-space:normal!important;}}
          .story-toc-page .story-toc-entry:hover .story-toc-title,.story-toc-page .story-toc-entry:focus .story-toc-title{{text-decoration:underline!important;text-decoration-thickness:1px!important;text-underline-offset:.18em!important;}}
          @media print{{.story-toc-page .story-toc-clean-list{{width:min(150mm,100%)!important;max-width:150mm!important;}}.story-toc-page .story-toc-row{{padding:.3rem 0!important;}}.story-toc-page .story-toc-thumb{{flex-basis:18mm!important;width:18mm!important;min-width:18mm!important;height:12mm!important;border-radius:2.2mm!important;box-shadow:none!important;}}.story-toc-page .story-toc-title{{font-size:12.5pt!important;}}}}
          </style>
          '''.strip()

          OLD_TOC_STYLE_RE = re.compile(r'\n?\s*<style id="v11[0-9]-appendix-story-toc[^>]*>.*?</style>', re.S | re.I)
          ANY_NEW_STYLE_RE = re.compile(r'\n?\s*<style id="v11[5-8]-appendix-story-toc[^>]*>.*?</style>', re.S | re.I)
          HEAD_RE = re.compile(r'</head>', re.I)
          STORY_LIST_RE = re.compile(r'<div class="story-toc-clean-list"[^>]*>(?P<body>.*?)</div>', re.S | re.I)
          STORY_ROW_RE = re.compile(r'<p class="story-toc-row"[^>]*>(?P<body>.*?)</p>', re.S | re.I)
          HREF_RE = re.compile(r'href=["\']#(?P<id>[^"\']+)["\']', re.I)
          IMG_SRC_RE = re.compile(r'<img\b[^>]*\bsrc=["\'](?P<src>[^"\']+)["\'][^>]*>', re.I | re.S)
          TAG_RE = re.compile(r'<[^>]+>', re.S)
          WS_RE = re.compile(r'\s+')

          def text_only(fragment: str) -> str:
            fragment = IMG_SRC_RE.sub('', fragment)
            fragment = TAG_RE.sub('', fragment)
            fragment = html.unescape(fragment)
            return WS_RE.sub(' ', fragment).strip()

          def first_image_in_story(text: str, story_id: str):
            start_match = re.search(r'<section\b[^>]*\bid=["\']' + re.escape(story_id) + r'["\'][^>]*>', text, re.I | re.S)
            if not start_match:
              return None
            start = start_match.start()
            next_match = re.search(r'<section\b[^>]*\bid=["\']story-\d+["\'][^>]*>', text[start + 1:], re.I | re.S)
            end = start + 1 + next_match.start() if next_match else len(text)
            section = text[start:end]
            for img in IMG_SRC_RE.finditer(section):
              src = img.group('src')
              low = src.lower()
              if any(skip in low for skip in ('cover', 'logo', 'favicon', 'apple-touch-icon')):
                continue
              return src
            first = IMG_SRC_RE.search(section)
            return first.group('src') if first else None

          def rebuild_story_toc(text: str, direction: str) -> str:
            is_rtl = direction == 'rtl'
            align = 'right' if is_rtl else 'left'
            list_style = (
              'display:block!important;width:min(620px,100%)!important;max-width:620px!important;'
              'margin-top:24px!important;margin-bottom:0!important;padding:0!important;'
              f'direction:{direction}!important;text-align:{align}!important;'
              + ('margin-right:0!important;margin-left:auto!important;' if is_rtl else 'margin-left:0!important;margin-right:auto!important;')
            )
            row_style = f'display:block!important;margin:0!important;padding:.48rem 0!important;border-block-start:1px solid rgba(197,121,29,.22)!important;direction:{direction}!important;text-align:{align}!important;'
            entry_style = f'display:inline-flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;width:auto!important;max-width:100%!important;min-height:42px!important;margin:0!important;padding:0!important;color:#08737a!important;text-decoration:none!important;vertical-align:middle!important;direction:{direction}!important;text-align:{align}!important;'
            img_style = 'display:block!important;flex:0 0 58px!important;width:58px!important;min-width:58px!important;height:40px!important;object-fit:cover!important;object-position:center center!important;border-radius:8px!important;border:1px solid rgba(10,58,104,.13)!important;background:#fffaf0!important;box-shadow:0 3px 9px rgba(20,40,60,.07)!important;margin:0!important;'
            title_style = f'display:block!important;min-width:0!important;color:#08737a!important;font-size:22px!important;line-height:1.25!important;font-weight:700!important;direction:{direction}!important;text-align:{align}!important;white-space:normal!important;'

            def replace_list(match):
              rows = []
              first = True
              for row in STORY_ROW_RE.finditer(match.group('body')):
                body = row.group('body')
                href = HREF_RE.search(body)
                if not href:
                  continue
                story_id = html.unescape(href.group('id'))
                title = text_only(body)
                src = first_image_in_story(text, story_id)
                if not title or not src:
                  continue
                current_row_style = row_style + ('border-block-start:0!important;' if first else '')
                first = False
                rows.append(
                  f'<p class="story-toc-row" style="{current_row_style}">'
                  f'<a class="story-toc-entry" href="#{html.escape(story_id, quote=True)}" style="{entry_style}">'
                  f'<img class="story-toc-thumb" src="{html.escape(src, quote=True)}" alt="" loading="lazy" decoding="async" style="{img_style}"/>'
                  f'<span class="story-toc-title" style="{title_style}">{html.escape(title)}</span>'
                  f'</a></p>'
                )
              return f'<div class="story-toc-clean-list" style="{list_style}">' + ''.join(rows) + '</div>' if rows else match.group(0)
            return STORY_LIST_RE.sub(replace_list, text, count=1)

          changed = []
          for path, direction in TARGETS:
            if not path.exists():
              continue
            old = path.read_text(encoding='utf-8')
            new = OLD_TOC_STYLE_RE.sub('', old)
            new = ANY_NEW_STYLE_RE.sub('', new)
            new = rebuild_story_toc(new, direction)
            if HEAD_RE.search(new):
              new = HEAD_RE.sub(CSS + '\n</head>', new, count=1)
            if new != old:
              path.write_text(new, encoding='utf-8')
              changed.append(str(path))

          print('patched files:')
          for item in changed:
            print(item)
          if not changed:
            print('no changes needed')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/files/appendices/stories-before-thought-hebrew-rtl.html site/files/appendices/stories-before-thought-english.html
          git commit -m "Pin appendix TOC rows to language side"
          git push
