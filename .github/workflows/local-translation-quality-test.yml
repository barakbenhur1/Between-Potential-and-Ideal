name: Local Translation Quality Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-translation-quality-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [tlh, qya]
        model: [qwen2.5:3b, qwen2.5:7b]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama and model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:11434/api/tags && break || sleep 2; done
          ollama pull '${{ matrix.model }}'
      - name: Rewrite segment 080 with bounded generation
        env:
          LANGUAGE: ${{ matrix.language }}
          MODEL: ${{ matrix.model }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, urllib.request
          lang=os.environ['LANGUAGE']
          model=os.environ['MODEL']
          source=Path(f'localization/sources/{lang}/between-potential-and-ideal/080-god-as-potential.md').read_text(encoding='utf-8')
          target={
            'tlh': "idiomatic standard Klingon (tlhIngan Hol) in Latin transcription, using attested vocabulary and transparent descriptive clauses rather than ordinary English loans",
            'qya': "literary Neo-Quenya using one conservative Tolkienian grammar profile and transparent descriptive phrases rather than English, Spanish, or Portuguese loans",
          }[lang]
          prompt=f'''You are a meticulous professional constructed-language editor. Rewrite the COMPLETE Markdown below into {target}. Preserve YAML front matter, every heading, paragraph, image path, quotation, inline code, logical distinction, and order. Replace ordinary foreign-language prose, while retaining the protected brand Between Potential and Ideal, personal names, citations, URLs, abbreviations, formulas, and formally named scientific theories. Keep the five English Segment review gate instructions exactly as review metadata. Return only the complete rewritten Markdown, with no code fences or commentary. Never summarize, omit, repeat filler, or stop early.\n\n{source}'''
          payload=json.dumps({
            'model': model,
            'prompt': prompt,
            'stream': False,
            'options': {'temperature': 0.1, 'num_predict': 2600, 'num_ctx': 8192, 'repeat_penalty': 1.15}
          }).encode()
          req=urllib.request.Request('http://127.0.0.1:11434/api/generate',data=payload,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=1500) as response:
            translated=json.load(response)['response'].strip()
          if translated.startswith('```'):
            translated=translated.split('\n',1)[1]
            if translated.rstrip().endswith('```'):
              translated=translated.rstrip()[:-3].rstrip()
          if len(translated) < max(1000, int(len(source)*0.55)):
            raise SystemExit(f'incomplete output: source={len(source)} translated={len(translated)}')
          out=Path('quality-test')
          out.mkdir(exist_ok=True)
          tag=model.replace(':','-')
          (out/f'080-{lang}-{tag}.md').write_text(translated+'\n',encoding='utf-8')
          (out/f'080-{lang}-source.md').write_text(source,encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: local-translation-quality-${{ matrix.language }}-${{ strategy.job-index }}
          path: quality-test/
          retention-days: 1
