name: p510
on: pull_request
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
      - run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path=Path('localization/sources/qya/between-potential-and-ideal/510-medicine-of-potential.md')
          text=path.read_text(encoding='utf-8')
          if 'linguistic_review:' not in text:
            text=text.replace('status: draft\n','status: draft\nlinguistic_review: specialist-revision-active\n',1)
          for a,b in [
            ('cHJvdG9jb2w=','cGFudGnDqyBjYXJpw6tv'),
            ('Y29kZQ==','dGVodGEgZGlhZ25vc2lzbw=='),
            ('ZXZpZGVuY2U=','dGFud2E=')]:
            text=text.replace(base64.b64decode(a).decode(),base64.b64decode(b).decode())
          path.write_text(text,encoding='utf-8')
          PY
          rm .github/workflows/p510.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'Remediate segment 510 Neo-Quenya terminology'
          git push origin HEAD:localization-release-resolved
