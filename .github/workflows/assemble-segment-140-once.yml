name: Assemble segment 140 once

on:
  push:
    branches: [localization-release-resolved]
    paths:
      - .github/workflows/assemble-segment-140-once.yml

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
      - name: Assemble reviewed source
        shell: bash
        run: |
          cat localization/staging/qya-140-part-{1,2,3,4}.txt > localization/sources/qya/between-potential-and-ideal/140-self-ego-unity-part-1.md
          rm localization/staging/qya-140-part-{1,2,3,4}.txt
          rm docs/connector-probe.txt
          rm .github/workflows/assemble-segment-140-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble segment 140 Neo-Quenya source'
          git push origin HEAD:localization-release-resolved
