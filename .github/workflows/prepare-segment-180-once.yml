name: Prepare segment 180 once

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/prepare-segment-180-once.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Normalize review wording
        shell: bash
        run: |
          FILE=localization/sources/tlh/between-potential-and-ideal/180-ai-open-problems.md
          sed -i '64s/safety/protective/' "$FILE"
          rm .github/workflows/prepare-segment-180-once.yml
          git diff --check
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'Normalize segment 180 review wording'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
