name: Finish segment 170 once

on:
  push:
    branches: [localization-release-resolved]
    paths: [.github/workflows/finish-segment-170-once.yml]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
      - name: Append required structure and clean staging
        shell: bash
        run: |
          cat localization/staging/170-required-block.txt >> localization/sources/tlh/between-potential-and-ideal/170-ai-mirror-existence-navigation.md
          cat localization/staging/170-required-gate.txt >> localization/sources/tlh/between-potential-and-ideal/170-ai-mirror-existence-navigation.md
          rm -f localization/staging/170-*.txt
          rm -f docs/status-sync-marker.txt docs/segment-170-gate-note.txt
          rm .github/workflows/finish-segment-170-once.yml
          git diff --check
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'Complete segment 170 structure'
          git push origin HEAD:localization-release-resolved
