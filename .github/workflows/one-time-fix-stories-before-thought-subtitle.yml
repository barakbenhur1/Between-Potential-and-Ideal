name: One-time fix Stories Before Thought subtitle structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-stories-before-thought-subtitle.yml'

permissions:
  contents: write

jobs:
  fix-stories-subtitle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install document converters
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf fonts-noto-core fonts-noto-extra fonts-noto-color-emoji

      - name: Fix subtitle/explanation structure in all story appendix source files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          from collections import defaultdict

          REPORT = Path('docs/stories-before-thought-subtitle-fix.md')
          REPORT.parent.mkdir(parents=True, exist_ok=True)

          HE_TITLE = 'סיפורים לפני המחשבה'
          HE_SUBTITLE = 'סיפורים שסיפרתי לאמי לפני השינה'
          HE_SUBTITLE_OLD_1 = 'סיפורים שסיפרתי לאימי לפני השינה'
          HE_EXPLANATION = 'נספחים ספרותיים לתאוריה, מתורגמים ומעוצבים לשתי השפות'

          EN_TITLE = 'Stories Before Thought'
          EN_SUBTITLE = 'Stories I Told My Mother Before Sleep'
          EN_EXPLANATION = 'Literary appendices to the theory, translated and designed in both languages.'

          TEXT_EXTS = {'.html', '.htm', '.md', '.txt'}
          changed = []
          regenerated = []

          def is_target_text(text: str) -> bool:
              low = text.lower()
              return (
                  HE_TITLE in text or
                  HE_SUBTITLE_OLD_1 in text or
                  HE_SUBTITLE in text or
                  EN_TITLE.lower() in low or
                  'stories i told my mother' in low or
                  'bedtime stories i told my mother' in low
              )

          def ensure_cover_explanation_css(html: str) -> str:
              if 'story-cover-explanation' in html and 'bpi-story-subtitle-structure-fix' in html:
                  return html
              css = '''\n<style id="bpi-story-subtitle-structure-fix">\n.story-cover-explanation,.appendix-cover-explanation,.cover-explanation{\n  margin:.35rem auto 1.15rem!important;\n  max-width:70ch!important;\n  color:#425468!important;\n  font-size:clamp(1rem,1.65vw,1.18rem)!important;\n  line-height:1.55!important;\n  font-style:normal!important;\n  font-weight:500!important;\n}\n.story-subtitle,.subtitle,.cover-subtitle{\n  margin:.25rem auto .35rem!important;\n}\n</style>\n'''
              if '</head>' in html:
                  return html.replace('</head>', css + '</head>', 1)
              return css + html

          def split_he_html(html: str) -> str:
              # Normalize spelling requested by user.
              html = html.replace(HE_SUBTITLE_OLD_1, HE_SUBTITLE)

              # Case 1: combined subtitle/explanation in one paragraph-like block.
              patterns = [
                  rf'(<p\b[^>]*(?:subtitle|lead|cover-subtitle|story-subtitle)[^>]*>\s*){re.escape(HE_SUBTITLE)}\s*[—–\-:]\s*{re.escape(HE_EXPLANATION)}\s*(</p>)',
                  rf'(<div\b[^>]*(?:subtitle|lead|cover-subtitle|story-subtitle)[^>]*>\s*){re.escape(HE_SUBTITLE)}\s*[—–\-:]\s*{re.escape(HE_EXPLANATION)}\s*(</div>)',
                  rf'(<h[23]\b[^>]*>\s*){re.escape(HE_SUBTITLE)}\s*[—–\-:]\s*{re.escape(HE_EXPLANATION)}\s*(</h[23]>)',
              ]
              for pat in patterns:
                  html = re.sub(pat, rf'\1{HE_SUBTITLE}\2\n<p class="story-cover-explanation cover-explanation">{HE_EXPLANATION}</p>', html, flags=re.I|re.S)

              # Case 2: explanation accidentally inside subtitle after a line break / nested span.
              html = re.sub(
                  rf'({re.escape(HE_SUBTITLE)}\s*)(?:<br\s*/?>\s*)?{re.escape(HE_EXPLANATION)}',
                  rf'{HE_SUBTITLE}</p>\n<p class="story-cover-explanation cover-explanation">{HE_EXPLANATION}</p><p class="bpi-remove-empty-subtitle-fix" style="display:none">',
                  html,
                  flags=re.I
              )
              html = html.replace('<p class="bpi-remove-empty-subtitle-fix" style="display:none"></p>', '')

              # Case 3: title followed by combined plain text, common in generated one-line HTML.
              html = html.replace(
                  f'{HE_SUBTITLE} — {HE_EXPLANATION}',
                  f'{HE_SUBTITLE}</p><p class="story-cover-explanation cover-explanation">{HE_EXPLANATION}'
              )
              html = html.replace(
                  f'{HE_SUBTITLE} - {HE_EXPLANATION}',
                  f'{HE_SUBTITLE}</p><p class="story-cover-explanation cover-explanation">{HE_EXPLANATION}'
              )

              return html

          def split_en_html(html: str) -> str:
              variants = [
                  'Stories I Told My Mother Before Sleep',
                  'Stories I Told My Mother Before Bed',
                  'Bedtime Stories I Told My Mother',
                  'Stories I Told My Mother at Bedtime',
              ]
              explanations = [
                  EN_EXPLANATION,
                  'Literary appendices to the theory, translated and designed for both languages.',
                  'Literary appendices to the theory, translated and designed in two languages.',
              ]
              for old in variants:
                  if old != EN_SUBTITLE:
                      html = html.replace(old, EN_SUBTITLE)
              for exp in explanations:
                  patterns = [
                      rf'(<p\b[^>]*(?:subtitle|lead|cover-subtitle|story-subtitle)[^>]*>\s*){re.escape(EN_SUBTITLE)}\s*[—–\-:]\s*{re.escape(exp)}\s*(</p>)',
                      rf'(<div\b[^>]*(?:subtitle|lead|cover-subtitle|story-subtitle)[^>]*>\s*){re.escape(EN_SUBTITLE)}\s*[—–\-:]\s*{re.escape(exp)}\s*(</div>)',
                      rf'(<h[23]\b[^>]*>\s*){re.escape(EN_SUBTITLE)}\s*[—–\-:]\s*{re.escape(exp)}\s*(</h[23]>)',
                  ]
                  for pat in patterns:
                      html = re.sub(pat, rf'\1{EN_SUBTITLE}\2\n<p class="story-cover-explanation cover-explanation">{EN_EXPLANATION}</p>', html, flags=re.I|re.S)
                  html = html.replace(
                      f'{EN_SUBTITLE} — {exp}',
                      f'{EN_SUBTITLE}</p><p class="story-cover-explanation cover-explanation">{EN_EXPLANATION}'
                  )
                  html = html.replace(
                      f'{EN_SUBTITLE} - {exp}',
                      f'{EN_SUBTITLE}</p><p class="story-cover-explanation cover-explanation">{EN_EXPLANATION}'
                  )
              return html

          def patch_html(path: Path, text: str) -> str:
              out = text
              out = split_he_html(out)
              out = split_en_html(out)
              out = ensure_cover_explanation_css(out)
              # Clean accidental empty hidden paragraph introduced only when needed.
              out = out.replace('<p class="bpi-remove-empty-subtitle-fix" style="display:none"></p>', '')
              return out

          def patch_md_or_txt(text: str) -> str:
              out = text.replace(HE_SUBTITLE_OLD_1, HE_SUBTITLE)
              # Hebrew combined subtitle lines.
              out = re.sub(
                  rf'(^\s*(?:[#>*_\- ]*)?){re.escape(HE_SUBTITLE)}\s*[—–\-:]\s*{re.escape(HE_EXPLANATION)}\s*$',
                  rf'\1{HE_SUBTITLE}\n\n{HE_EXPLANATION}',
                  out,
                  flags=re.M
              )
              # English combined subtitle lines.
              for old_sub in ['Stories I Told My Mother Before Sleep','Stories I Told My Mother Before Bed','Bedtime Stories I Told My Mother','Stories I Told My Mother at Bedtime']:
                  out = out.replace(old_sub, EN_SUBTITLE)
              for exp in [EN_EXPLANATION,'Literary appendices to the theory, translated and designed for both languages.','Literary appendices to the theory, translated and designed in two languages.']:
                  out = re.sub(
                      rf'(^\s*(?:[#>*_\- ]*)?){re.escape(EN_SUBTITLE)}\s*[—–\-:]\s*{re.escape(exp)}\s*$',
                      rf'\1{EN_SUBTITLE}\n\n{EN_EXPLANATION}',
                      out,
                      flags=re.M|re.I
                  )
              return out

          for path in sorted(Path('site').rglob('*')):
              if not path.is_file() or path.suffix.lower() not in TEXT_EXTS:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if not is_target_text(text):
                  continue
              new = patch_html(path, text) if path.suffix.lower() in {'.html','.htm'} else patch_md_or_txt(text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          # Regenerate same-stem PDF/DOCX for changed HTML files when binary outputs already exist.
          for html_path_str in changed:
              html_path = Path(html_path_str)
              if html_path.suffix.lower() not in {'.html','.htm'}:
                  continue
              pdf = html_path.with_suffix('.pdf')
              docx = html_path.with_suffix('.docx')
              if pdf.exists():
                  try:
                      subprocess.run(['wkhtmltopdf','--enable-local-file-access',str(html_path),str(pdf)], check=True)
                      regenerated.append(str(pdf))
                  except Exception as e:
                      print('PDF regeneration failed for', html_path, e)
              if docx.exists():
                  try:
                      subprocess.run(['pandoc',str(html_path),'--from=html','--to=docx',f'--resource-path={html_path.parent}:site:site/figures','--output',str(docx)], check=True)
                      regenerated.append(str(docx))
                  except Exception as e:
                      print('DOCX regeneration failed for', html_path, e)

          lines = ['# Stories Before Thought subtitle structure fix','']
          lines.append('Requested structure:')
          lines.append('')
          lines.append('- Title: `סיפורים לפני המחשבה` / `Stories Before Thought`')
          lines.append('- Subtitle: `סיפורים שסיפרתי לאמי לפני השינה` / `Stories I Told My Mother Before Sleep`')
          lines.append('- Explanation: `נספחים ספרותיים לתאוריה, מתורגמים ומעוצבים לשתי השפות` / `Literary appendices to the theory, translated and designed in both languages.`')
          lines.append('')
          lines.append('## Changed source files')
          if changed:
              lines += [f'- `{p}`' for p in changed]
          else:
              lines.append('- No matching source files changed. The exact combined subtitle text was not found in text-based source files.')
          lines.append('')
          lines.append('## Regenerated binary outputs')
          if regenerated:
              lines += [f'- `{p}`' for p in regenerated]
          else:
              lines.append('- No same-stem PDF/DOCX outputs required regeneration or converter regeneration failed.')
          REPORT.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Remove workflow
        run: rm -f .github/workflows/one-time-fix-stories-before-thought-subtitle.yml

      - name: Commit subtitle structure fix
        run: |
          git config user.name "Barak Ben Hur via ChatGPT"
          git config user.email "barakbenhur@gmail.com"
          if ! git diff --quiet; then
            git add site docs/stories-before-thought-subtitle-fix.md .github/workflows/one-time-fix-stories-before-thought-subtitle.yml
            git commit -m "Fix Stories Before Thought subtitle structure"
            git push
          else
            echo "No changes to commit"
          fi
