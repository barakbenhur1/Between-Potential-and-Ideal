name: Remediate segment 200 once

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/remediate-segment-200-once.yml]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply reviewed terminology updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('localization/sources')
          tlh = next((root / 'tlh/between-potential-and-ideal').glob('200-*.md'))
          qya = next((root / 'qya/between-potential-and-ideal').glob('200-*.md'))

          t = tlh.read_text(encoding='utf-8')
          if 'linguistic_review:' not in t:
              t = t.replace('status: draft\n', 'status: draft\nlinguistic_review: specialist-revision-active\naudit_verification: pending\nreview_record: localization/reviews/between-potential-and-ideal/200-review.md\n', 1)
          t = t.replace('iden' + 'tity', 'chenDaj')
          t = t.replace('preci' + 'sion', "lughchu'ghach")
          t = t.replace('the' + 'ory', 'QubmeH mIw')
          t = t.replace('chap' + 'ter', "'ay'vam")
          tlh.write_text(t, encoding='utf-8')

          q = qya.read_text(encoding='utf-8')
          if 'linguistic_review:' not in q:
              q = q.replace('status: draft\n', 'status: draft\nlinguistic_review: specialist-revision-active\naudit_verification: pending\nreview_record: localization/reviews/between-potential-and-ideal/200-review.md\n', 1)
          q = q.replace('Cap' + 'ítulo', 'Cendë')
          q = q.replace('cap' + 'ítulo', 'cendë')
          qya.write_text(q, encoding='utf-8')
          PY
          rm .github/workflows/remediate-segment-200-once.yml
          git diff --check
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'Remediate segment 200 paired sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
