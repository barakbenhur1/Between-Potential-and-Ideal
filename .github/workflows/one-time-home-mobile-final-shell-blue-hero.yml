name: One-time final Home mobile shell and blue hero fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-home-mobile-final-shell-blue-hero.yml'

permissions:
  contents: write

jobs:
  fix-home-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Add final Home mobile override after existing Home script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = '20260526-home-final-summary-shell-blue-hero-v116'
          asset = Path('site/assets/bpi-home-mobile-final-shell.js')
          asset.parent.mkdir(parents=True, exist_ok=True)
          asset.write_text(r'''/* V116 — final scoped Home mobile fix.
   Scope: Home entry pages only, mobile only.
   Source of truth for top shell: Summary tab mobile proportions.
   Home opening hero remains the unique blue/turquoise card. */
(function(){
  'use strict';

  function isHomePage(){
    var path = (location.pathname || '').toLowerCase();
    return path === '/' || path.endsWith('/index.html') || path.endsWith('/en.html') ||
      path.endsWith('/site/index.html') || path.endsWith('/site/en.html');
  }

  function install(){
    if (!isHomePage() || document.getElementById('bpi-home-mobile-final-shell-v116')) return;
    var style = document.createElement('style');
    style.id = 'bpi-home-mobile-final-shell-v116';
    style.textContent = [
      '@media (max-width:860px){',
      'html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important;}',
      'body.public-page{max-width:100vw!important;overflow-x:hidden!important;background:radial-gradient(circle at 0% 12%,rgba(0,167,183,.07),transparent 34rem),radial-gradient(circle at 100% 0%,rgba(242,142,43,.10),transparent 34rem),#f7efe1!important;color:#102033!important;}',

      /* Top shell: Summary tab values, not the old Home landing header. */
      'body.public-page .site-header,body.public-page header.site-header,.site-header{width:100%!important;max-width:100vw!important;margin:0!important;padding:33px 22px 26px!important;box-sizing:border-box!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:19px!important;border:0!important;border-radius:0!important;overflow:hidden!important;overflow-x:hidden!important;background:linear-gradient(135deg,#0A3A68,#0C526D 58%,rgba(242,142,43,.92))!important;box-shadow:none!important;color:#fff!important;text-align:center!important;}',
      'body.public-page .site-brand,.site-header .site-brand{width:100%!important;display:flex!important;justify-content:center!important;align-items:center!important;margin:0!important;min-width:0!important;max-width:100%!important;text-align:center!important;}',
      'body.public-page .site-brand a,.site-header .site-brand a{display:block!important;width:100%!important;text-align:center!important;color:#fff!important;text-decoration:none!important;font-family:Georgia,"Times New Roman",serif!important;font-weight:800!important;font-size:clamp(1.32rem,4.1vw,1.72rem)!important;line-height:1.12!important;letter-spacing:.01em!important;white-space:normal!important;}',
      'body.public-page .site-header .site-nav,.site-header .site-nav,nav.site-nav{display:flex!important;flex-direction:row!important;flex-wrap:wrap!important;justify-content:center!important;align-items:center!important;align-content:center!important;width:100%!important;max-width:680px!important;min-width:0!important;height:auto!important;max-height:none!important;box-sizing:border-box!important;overflow:visible!important;overflow-x:visible!important;overflow-y:visible!important;white-space:normal!important;gap:8px 6px!important;margin:0 auto!important;padding:0!important;scrollbar-width:none!important;scroll-snap-type:none!important;text-align:center!important;}',
      'body.public-page .site-header .site-nav::-webkit-scrollbar,.site-header .site-nav::-webkit-scrollbar,nav.site-nav::-webkit-scrollbar{display:none!important;}',
      'body.public-page .site-header .site-nav a,.site-header .site-nav a,nav.site-nav a{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 auto!important;min-width:0!important;max-width:none!important;box-sizing:border-box!important;min-height:36px!important;padding:.39rem .56rem!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.28)!important;background:rgba(255,255,255,.10)!important;color:#fff!important;text-decoration:none!important;font-family:Georgia,"Times New Roman","Noto Serif Hebrew",serif!important;font-size:clamp(.86rem,3.28vw,1rem)!important;font-weight:700!important;line-height:1!important;letter-spacing:.01em!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;transform:none!important;scroll-snap-align:none!important;box-shadow:none!important;}',
      'body.public-page .site-header .site-nav a.active,body.public-page .site-header .site-nav a[aria-current="page"],.site-header .site-nav a.active,.site-header .site-nav a[aria-current="page"]{background:rgba(255,255,255,.22)!important;border-color:rgba(255,255,255,.46)!important;box-shadow:0 8px 20px rgba(255,255,255,.08) inset,0 6px 18px rgba(0,0,0,.05)!important;color:#fff!important;}',
      'body.public-page .language-switch,.site-header .language-switch{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;max-width:680px!important;min-height:44px!important;margin:18px auto 0!important;padding:.48rem 1rem!important;box-sizing:border-box!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.30)!important;background:rgba(255,255,255,.08)!important;color:#fff!important;text-decoration:none!important;font-family:Georgia,"Times New Roman",serif!important;font-size:clamp(1rem,3.75vw,1.24rem)!important;font-weight:600!important;line-height:1!important;box-shadow:none!important;}',

      /* Page spacing follows Summary; inner Home hero stays blue. */
      'body.public-page .site-main{width:100%!important;max-width:100vw!important;overflow-x:hidden!important;box-sizing:border-box!important;background:transparent!important;color:#102033!important;padding:0!important;}',
      'body.public-page .breadcrumbs{width:min(100% - 40px,1120px)!important;max-width:calc(100vw - 40px)!important;margin:52px auto 14px!important;box-sizing:border-box!important;text-align:start!important;color:#5f6f7d!important;font-size:clamp(1rem,4vw,1.2rem)!important;line-height:1.35!important;}',
      'body.public-page .breadcrumbs a{color:#0A3A68!important;font-weight:800!important;text-decoration:underline!important;text-underline-offset:.18em!important;}',

      /* Restore the Home opening block: blue/turquoise card, white text, rounded hero. */
      'body.public-page .concise-hero,body.public-page .hero.concise-hero{display:block!important;width:min(100% - 52px,1120px)!important;max-width:calc(100vw - 52px)!important;margin:0 auto 26px!important;box-sizing:border-box!important;padding:clamp(34px,8vw,56px) clamp(24px,6vw,42px)!important;border-radius:30px!important;border:1px solid rgba(255,255,255,.22)!important;background:linear-gradient(145deg,#06466d 0%,#007b91 58%,#008fa2 100%)!important;color:#fffaf0!important;box-shadow:0 18px 48px rgba(10,58,104,.18)!important;text-align:center!important;overflow:hidden!important;}',
      'body.public-page .concise-hero::before,body.public-page .hero.concise-hero::before{display:none!important;content:none!important;}',
      'body.public-page .concise-hero .kicker,body.public-page .hero.concise-hero .kicker{color:#fffaf0!important;background:transparent!important;border:0!important;margin:0 auto clamp(30px,8vw,58px)!important;padding:0!important;text-align:center!important;font-weight:800!important;}',
      'body.public-page .concise-hero h1,body.public-page .hero.concise-hero h1{color:#fffaf0!important;text-align:center!important;margin:0 auto!important;max-width:760px!important;font-family:"Gveret Levin","Noto Sans Hebrew",Georgia,"Times New Roman",serif!important;font-size:clamp(2.7rem,11.5vw,4.8rem)!important;line-height:1.04!important;letter-spacing:-.025em!important;}',
      'body.public-page .concise-hero .lead,body.public-page .hero.concise-hero .lead,body.public-page .concise-hero .method-note,body.public-page .hero.concise-hero .method-note{color:rgba(255,250,240,.92)!important;text-align:center!important;margin-left:auto!important;margin-right:auto!important;max-width:72ch!important;background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;font-size:clamp(1rem,4.5vw,1.18rem)!important;line-height:1.7!important;}',
      'body.public-page .hero-cta-row{display:flex!important;justify-content:center!important;align-items:center!important;gap:10px!important;flex-wrap:wrap!important;margin-top:20px!important;}',
      'body.public-page .opening-visual,body.public-page .signature-blurbs,body.public-page .notice-box,body.public-page .hub-grid,body.public-page .reading-path-cta{width:min(100% - 40px,1120px)!important;max-width:calc(100vw - 40px)!important;margin-left:auto!important;margin-right:auto!important;box-sizing:border-box!important;}',
      '}',

      '@media (max-width:390px){',
      'body.public-page .site-header,body.public-page header.site-header,.site-header{padding:30px 18px 24px!important;gap:17px!important;}',
      'body.public-page .site-header .site-nav,.site-header .site-nav,nav.site-nav{gap:7px 5px!important;}',
      'body.public-page .site-header .site-nav a,.site-header .site-nav a,nav.site-nav a{padding:.38rem .52rem!important;font-size:clamp(.84rem,3.18vw,.96rem)!important;min-height:35px!important;}',
      'body.public-page .language-switch,.site-header .language-switch{min-height:43px!important;margin-top:17px!important;}',
      'body.public-page .breadcrumbs{width:min(100% - 34px,1120px)!important;max-width:calc(100vw - 34px)!important;margin-top:48px!important;}',
      'body.public-page .concise-hero,body.public-page .hero.concise-hero{width:min(100% - 40px,1120px)!important;max-width:calc(100vw - 40px)!important;padding:44px 22px!important;border-radius:28px!important;}',
      '}'
    ].join('');
    document.head.appendChild(style);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install);
  else install();
})();
''', encoding='utf-8')

          changed = []
          for html_path in [Path('site/index.html'), Path('site/en.html')]:
            html = html_path.read_text(encoding='utf-8', errors='ignore')
            original = html
            rel = os.path.relpath(asset, start=html_path.parent).replace(os.sep, '/')
            tag = f'<script src="{rel}?v={version}" defer></script>'
            html = re.sub(r'<script\s+src="[^"]*bpi-home-mobile-final-shell\.js\?v=[^"]*"\s+defer></script>\s*', '', html)
            if '</body>' in html:
              html = html.replace('</body>', tag + '\n</body>', 1)
            else:
              html += '\n' + tag + '\n'
            if html != original:
              html_path.write_text(html, encoding='utf-8')
              changed.append(str(html_path))

          report = Path('docs/home-mobile-final-shell-blue-hero-fix.md')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text('\n'.join([
            '# Home mobile final shell and blue hero fix',
            '',
            'Changed only Home entry pages and a Home-only mobile override script.',
            '',
            'Files changed:',
            '- `site/assets/bpi-home-mobile-final-shell.js` — applies the Summary tab mobile shell/header/nav proportions only on Home and restores the blue/turquoise Home opening card.',
            '- `site/index.html` — loads the Home-only override after the existing Home helper script.',
            '- `site/en.html` — loads the Home-only override after the existing Home helper script.',
            '',
            'No other tabs are changed. Desktop is not targeted by the override.',
            ''
          ]), encoding='utf-8')

          print('changed pages:', ', '.join(changed))
          PY

      - name: Remove workflow
        run: rm -f .github/workflows/one-time-home-mobile-final-shell-blue-hero.yml

      - name: Commit final Home mobile shell and blue hero fix
        run: |
          git config user.name "Barak Ben Hur via ChatGPT"
          git config user.email "barakbenhur@gmail.com"
          if ! git diff --quiet; then
            git add site/assets/bpi-home-mobile-final-shell.js site/index.html site/en.html docs/home-mobile-final-shell-blue-hero-fix.md .github/workflows/one-time-home-mobile-final-shell-blue-hero.yml
            git commit -m "Fix Home mobile shell and restore blue hero"
            git push
          else
            echo "No changes to commit"
          fi
