# Push trigger disabled by BPI ideal fixer to prevent one-time workflow regressions.
name: One-time final mobile nav feedback and files fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply final mobile nav, files filter, and feedback mail fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          site = Path('site')
          assets = site / 'assets'
          assets.mkdir(parents=True, exist_ok=True)

          css_path = assets / 'bpi-final-public-fixes.css'
          js_path = assets / 'bpi-final-public-fixes.js'
          version = '20260526-final-mobile-feedback-files-v1'

          css = r'''/* Final public UI fixes — mobile nav with no horizontal rail, no JS scrolling.
   The mobile top tabs wrap into rows. That removes the rail jump-to-start bug and
   keeps the selected tab inside the viewport. */
@media (max-width: 860px){
  html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important;}
  body.public-page .site-header,
  body.public-page header.site-header,
  .site-header{
    width:100%!important;
    max-width:100vw!important;
    box-sizing:border-box!important;
    overflow:hidden!important;
    padding-left:8px!important;
    padding-right:8px!important;
  }
  .site-brand,.language-switch{
    min-width:0!important;
    max-width:100%!important;
    box-sizing:border-box!important;
  }
  .site-nav,
  header .site-nav,
  body.public-page .site-nav{
    display:flex!important;
    flex-wrap:wrap!important;
    justify-content:center!important;
    align-items:center!important;
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    box-sizing:border-box!important;
    overflow:visible!important;
    overflow-x:visible!important;
    overflow-y:visible!important;
    gap:.34rem!important;
    padding:.35rem .15rem .44rem!important;
    margin:0!important;
    transform:none!important;
    scrollbar-width:none!important;
    scroll-snap-type:none!important;
  }
  .site-nav::-webkit-scrollbar{display:none!important;}
  .site-nav a,
  .site-nav a.active,
  .site-nav a[aria-current="page"],
  .site-nav [aria-current="page"]{
    flex:0 1 auto!important;
    min-width:0!important;
    max-width:calc(50vw - .75rem)!important;
    box-sizing:border-box!important;
    white-space:nowrap!important;
    overflow:hidden!important;
    text-overflow:ellipsis!important;
    transform:none!important;
    margin:0!important;
    scroll-snap-align:none!important;
  }
  .site-nav a.active,
  .site-nav a[aria-current="page"],
  .site-nav [aria-current="page"]{
    position:relative!important;
    z-index:1!important;
  }
  body.public-page .page-title,
  body.public-page .reader-card,
  body.public-page .hub-card,
  body.public-page .notice-box,
  body.public-page .method-note,
  body.public-page .file-card,
  body.public-page .appendix-card,
  body.public-page .media-card,
  body.public-page .table-wrap{
    max-width:100%!important;
    box-sizing:border-box!important;
  }
}
@media (max-width:480px){
  .site-nav{gap:.25rem!important;padding-inline:.1rem!important;}
  .site-nav a,
  .site-nav a.active,
  .site-nav a[aria-current="page"],
  .site-nav [aria-current="page"]{
    max-width:calc(50vw - .55rem)!important;
    padding-inline:.64rem!important;
    font-size:.94rem!important;
  }
}
@media (max-width:360px){
  .site-nav a,
  .site-nav a.active,
  .site-nav a[aria-current="page"],
  .site-nav [aria-current="page"]{
    max-width:calc(100vw - 1rem)!important;
  }
}
'''

          js = r'''/* Final public UI runtime fixes.
   Important: no nav scroll/scrollIntoView code. The nav bug is solved by CSS wrapping.
   This script only fixes feedback mail links and the files table filter. */
(function(){
  'use strict';

  var KNOWN_FORMATS = ['html','pdf','docx','md','txt'];

  function isHe(){
    return document.documentElement.lang === 'he' ||
      document.documentElement.dir === 'rtl' ||
      document.body.classList.contains('public-page-he');
  }

  function enc(value){ return encodeURIComponent(value).replace(/%20/g, '%20'); }

  function feedbackMailto(){
    var subject = isHe() ? 'ביקורת על Between Potential and Ideal' : 'Feedback on Between Potential and Ideal';
    var body = isHe() ? [
      'שלום ברק,',
      '',
      'קראתי את הפרויקט Between Potential and Ideal ויש לי ביקורת / הערה:',
      '',
      '',
      'העמוד שבו הייתי:',
      window.location.href,
      '',
      'הערה:'
    ].join('\n') : [
      'Hi Barak,',
      '',
      'I read Between Potential and Ideal and have feedback / a note:',
      '',
      '',
      'Page I was on:',
      window.location.href,
      '',
      'Feedback:'
    ].join('\n');
    return 'mailto:barakbenhur@gmail.com?subject=' + enc(subject) + '&body=' + enc(body);
  }

  function isFeedbackLink(el){
    if (!el || !el.getAttribute) return false;
    var href = (el.getAttribute('href') || '').toLowerCase();
    var text = (el.textContent || '').trim().toLowerCase();
    var aria = (el.getAttribute('aria-label') || '').toLowerCase();
    var title = (el.getAttribute('title') || '').toLowerCase();
    return href.indexOf('mail.google.com') !== -1 ||
      href.indexOf('gmail.com/mail') !== -1 ||
      text.indexOf('שלח ביקורת') !== -1 ||
      aria.indexOf('שלח ביקורת') !== -1 ||
      title.indexOf('שלח ביקורת') !== -1 ||
      text.indexOf('send feedback') !== -1 ||
      aria.indexOf('send feedback') !== -1 ||
      title.indexOf('send feedback') !== -1 ||
      ((text.indexOf('feedback') !== -1 || aria.indexOf('feedback') !== -1 || title.indexOf('feedback') !== -1) && (href.indexOf('gmail') !== -1 || href.indexOf('mailto:') === 0));
  }

  function patchFeedbackLinks(){
    var mail = feedbackMailto();
    document.querySelectorAll('a[href]').forEach(function(a){
      if (!isFeedbackLink(a)) return;
      a.setAttribute('href', mail);
      a.removeAttribute('target');
      a.removeAttribute('rel');
      a.setAttribute('data-bpi-feedback-fixed', 'true');
    });
  }

  document.addEventListener('click', function(event){
    var a = event.target && event.target.closest ? event.target.closest('a[href]') : null;
    if (!isFeedbackLink(a)) return;
    event.preventDefault();
    event.stopPropagation();
    window.location.href = feedbackMailto();
  }, true);

  function isFilesPage(){
    var path = window.location.pathname.toLowerCase();
    return path.endsWith('/files.html') || path.endsWith('/files-en.html') || !!document.querySelector('#fileSearch,#fileTypeFilter,#fileLangFilter,.download-table');
  }

  function normalizeFormat(value){
    value = (value || '').toLowerCase().trim();
    if (value === 'word' || value === 'doc') return 'docx';
    if (value === 'markdown') return 'md';
    if (value === 'text') return 'txt';
    return value;
  }

  function formatFromHref(href){
    var clean = (href || '').split('?')[0].split('#')[0].toLowerCase();
    var match = clean.match(/\.([a-z0-9]+)$/);
    if (!match) return '';
    var ext = normalizeFormat(match[1]);
    return KNOWN_FORMATS.indexOf(ext) !== -1 ? ext : '';
  }

  function rowText(row){
    var hrefs = Array.prototype.map.call(row.querySelectorAll('a[href]'), function(a){ return a.getAttribute('href') || ''; }).join(' ');
    return ((row.textContent || '') + ' ' + hrefs).toLowerCase();
  }

  function rowFormats(row){
    var formats = new Set();
    Array.prototype.forEach.call(row.querySelectorAll('a[href]'), function(a){
      var f = formatFromHref(a.getAttribute('href'));
      if (f) formats.add(f);
    });
    var text = rowText(row);
    if (text.indexOf('html') !== -1) formats.add('html');
    if (text.indexOf('pdf') !== -1) formats.add('pdf');
    if (text.indexOf('docx') !== -1 || text.indexOf('word') !== -1) formats.add('docx');
    if (text.indexOf('markdown') !== -1 || text.indexOf('.md') !== -1) formats.add('md');
    if (text.indexOf('text') !== -1 || text.indexOf('.txt') !== -1) formats.add('txt');

    if (text.indexOf('התאוריה הפילוסופית') !== -1 ||
        text.indexOf('התיאוריה הפילוסופית') !== -1 ||
        text.indexOf('philosophical theory') !== -1 ||
        text.indexOf('between-potential-and-ideal-he') !== -1 ||
        text.indexOf('between-potential-and-ideal-en') !== -1) {
      ['html','pdf','docx','md'].forEach(function(f){ formats.add(f); });
    }
    return formats;
  }

  function applyFilesFilter(){
    if (!isFilesPage()) return;
    var rows = Array.prototype.slice.call(document.querySelectorAll('.download-table tr'), 1);
    if (!rows.length) return;

    var qEl = document.querySelector('#fileSearch');
    var typeEl = document.querySelector('#fileTypeFilter');
    var langEl = document.querySelector('#fileLangFilter');
    var query = (qEl && qEl.value || '').toLowerCase().trim();
    var type = normalizeFormat(typeEl && typeEl.value || '');
    var lang = (langEl && langEl.value || '').toLowerCase().trim();
    var visible = 0;

    rows.forEach(function(row){
      var text = rowText(row);
      var formats = rowFormats(row);
      var formatValue = Array.from(formats).sort().join(' ');
      row.setAttribute('data-format', formatValue);
      row.setAttribute('data-formats', formatValue);

      var okQuery = !query || text.indexOf(query) !== -1;
      var okType = !type || formats.has(type);
      var okLang = !lang || text.indexOf(lang) !== -1;
      var ok = okQuery && okType && okLang;
      row.style.display = ok ? '' : 'none';
      if (ok) visible += 1;
    });

    var count = document.querySelector('#fileFilterCount');
    if (count) count.textContent = isHe() ? ('מוצגים ' + visible + ' קבצים') : (visible + ' files shown');
  }

  function installFilesFilter(){
    if (!isFilesPage()) return;
    var search = document.querySelector('#fileSearch');
    var type = document.querySelector('#fileTypeFilter');
    var lang = document.querySelector('#fileLangFilter');
    if (search) search.addEventListener('input', function(){ setTimeout(applyFilesFilter, 0); });
    if (type) type.addEventListener('change', function(){ setTimeout(applyFilesFilter, 0); });
    if (lang) lang.addEventListener('change', function(){ setTimeout(applyFilesFilter, 0); });
    applyFilesFilter();
  }

  function init(){
    patchFeedbackLinks();
    installFilesFilter();
    setTimeout(function(){ patchFeedbackLinks(); applyFilesFilter(); }, 150);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
'''

          css_path.write_text(css, encoding='utf-8')
          js_path.write_text(js, encoding='utf-8')

          styles = site / 'styles.css'
          if styles.exists():
              text = styles.read_text(encoding='utf-8')
              # Remove old imports for earlier failed/partial attempts, then append the final import.
              text = re.sub(r'@import url\("\.\/assets\/bpi-mobile-site-fixes\.css\?v=[^"\n]+"\);\n?', '', text)
              text = re.sub(r'@import url\("\.\/assets\/bpi-critical-public-ui-fixes\.css\?v=[^"\n]+"\);\n?', '', text)
              text = re.sub(r'@import url\("\.\/assets\/bpi-final-public-fixes\.css\?v=[^"\n]+"\);\n?', '', text)
              if not text.endswith('\n'):
                  text += '\n'
              text += f'@import url("./assets/bpi-final-public-fixes.css?v={version}");\n'
              styles.write_text(text, encoding='utf-8')

          mailto = 'mailto:barakbenhur@gmail.com?subject=%D7%91%D7%99%D7%A7%D7%95%D7%A8%D7%AA%20%D7%A2%D7%9C%20Between%20Potential%20and%20Ideal&body=%D7%A9%D7%9C%D7%95%D7%9D%20%D7%91%D7%A8%D7%A7%2C%0A%0A%D7%A7%D7%A8%D7%90%D7%AA%D7%99%20%D7%90%D7%AA%20%D7%94%D7%A4%D7%A8%D7%95%D7%99%D7%A7%D7%98%20Between%20Potential%20and%20Ideal%20%D7%95%D7%99%D7%A9%20%D7%9C%D7%99%20%D7%91%D7%99%D7%A7%D7%95%D7%A8%D7%AA%20%2F%20%D7%94%D7%A2%D7%A8%D7%94%3A%0A%0A%D7%94%D7%A2%D7%A8%D7%94%3A'
          changed = []
          for path in [site / 'index.html', site / 'en.html'] + sorted((site / 'pages').glob('**/*.html')):
              if not path.exists():
                  continue
              html = path.read_text(encoding='utf-8', errors='ignore')
              original = html

              rel = os.path.relpath(js_path, start=path.parent).replace(os.sep, '/')
              tag = f'<script src="{rel}?v={version}" defer></script>'

              # Remove earlier failed/partial scripts if they were injected, then inject final script.
              html = re.sub(r'<script\s+src="[^"]*bpi-critical-public-ui-fixes\.js\?v=[^"]*"\s+defer></script>\s*', '', html)
              html = re.sub(r'<script\s+src="[^"]*bpi-final-public-fixes\.js\?v=[^"]*"\s+defer></script>\s*', '', html)
              if '</body>' in html:
                  html = html.replace('</body>', tag + '\n</body>', 1)
              else:
                  html += '\n' + tag + '\n'

              # Directly stop Gmail blank-tab behavior even before JS runs.
              html = re.sub(r'href="https?://(?:mail\.google\.com|www\.gmail\.com|gmail\.com)/[^"]*"', f'href="{mailto}"', html)
              html = re.sub(r'\s+target="_blank"(?=[^>]*(?:שלח ביקורת|Send feedback|feedback|mailto:))', '', html, flags=re.I)

              if html != original:
                  path.write_text(html, encoding='utf-8')
                  changed.append(str(path))

          report = Path('docs/final-mobile-feedback-files-fix.md')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text('\n'.join([
              '# Final mobile feedback files fix',
              '',
              '- Mobile tabs now wrap instead of horizontal scrolling.',
              '- No JavaScript scrollIntoView / nav scroll-centering is used.',
              '- Feedback Gmail links are replaced with mailto and guarded by JS.',
              '- Files table filtering normalizes Word→DOCX, Markdown→MD, Text→TXT and keeps the philosophical theory visible by format.',
              '',
              '## Changed HTML pages',
              *(f'- `{p}`' for p in changed),
              ''
          ]), encoding='utf-8')

          print('wrote final css/js and injected', len(changed), 'pages')
          PY

      - name: Remove this workflow
        run: rm -f .github/workflows/one-time-final-mobile-feedback-files-fix.yml

      - name: Commit final public UI fix
        run: |
          git config user.name "Barak Ben Hur via ChatGPT"
          git config user.email "barakbenhur@gmail.com"
          if ! git diff --quiet; then
            git add site docs/final-mobile-feedback-files-fix.md .github/workflows/one-time-final-mobile-feedback-files-fix.yml
            git commit -m "Apply final mobile nav feedback and files fixes"
            git push
          else
            echo "No changes to commit"
          fi
