name: Finalize Four-Language Localization Release

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write
  models: read

concurrency:
  group: finalize-four-language-localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 tools/prepare_localization_ai_jobs.py
      - id: matrix
        run: echo "matrix=$(jq -c . reports/localization/ai-jobs/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: localization-ai-jobs
          path: reports/localization/ai-jobs/
          if-no-files-found: error
          retention-days: 7

  translate:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: localization-ai-jobs
          path: reports/localization/ai-jobs
      - name: Build model input
        env:
          JOB_FILE: reports/localization/ai-jobs/${{ matrix.input }}
          TARGET_LANGUAGE: ${{ matrix.language_mode }}
        run: |
          mkdir -p reports/localization
          printf 'Translate the source Markdown into %s. Return only translated Markdown. Preserve all structure and content. Do not summarize or invent.\n\nGLOSSARY:\n' "$TARGET_LANGUAGE" > reports/localization/current-prompt.txt
          jq -r '.glossary' "$JOB_FILE" >> reports/localization/current-prompt.txt
          printf '\n\nSOURCE:\n' >> reports/localization/current-prompt.txt
          jq -r '.source' "$JOB_FILE" >> reports/localization/current-prompt.txt
      - id: inference
        uses: actions/ai-inference@v1
        with:
          prompt-file: reports/localization/current-prompt.txt
          model: openai/gpt-4o
          max-completion-tokens: 12000
          temperature: 0
      - name: Save result
        env:
          RESPONSE_FILE: ${{ steps.inference.outputs.response-file }}
          JOB_ID: ${{ matrix.id }}
        run: |
          mkdir -p reports/localization/ai-results
          cp "$RESPONSE_FILE" "reports/localization/ai-results/${JOB_ID}.json"
          test -s "reports/localization/ai-results/${JOB_ID}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: localization-ai-result-${{ matrix.id }}
          path: reports/localization/ai-results/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  integrate-build-and-qa:
    needs: [prepare, translate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          name: localization-ai-jobs
          path: reports/localization/ai-jobs
      - uses: actions/download-artifact@v4
        with:
          pattern: localization-ai-result-*
          path: reports/localization/ai-results
          merge-multiple: true
      - run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install beautifulsoup4 markdown python-docx pillow pymupdf lxml
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-dejavu-core
      - run: python3 tools/apply_localization_ai_results.py
      - run: python3 tools/temporary-5.txt
      - run: python3 tools/temporary-2.txt
      - run: python3 tools/temporary-6.txt
      - run: python3 tools/final_release_qa.py --scan
      - name: Commit release
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization site docs tools .github/workflows/finalize-localization-release.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish complete Klingon and Neo-Quenya editions [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localization-release-qa-${{ github.sha }}
          path: |
            reports/localization/
            reports/production_next/
          if-no-files-found: warn
          retention-days: 14
