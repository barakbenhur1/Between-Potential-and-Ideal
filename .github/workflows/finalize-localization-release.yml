name: Publish Approved Four-Language Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-approved-four-language-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require complete translation and linguistic approval
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('localization/release-state.json').read_text(encoding='utf-8'))
          review = json.loads(Path('localization/reviews/between-potential-and-ideal/review-progress.json').read_text(encoding='utf-8'))
          total = int(review.get('total_segment_pairs', 0))
          reviewed = int(review.get('reviewed_pairs', review.get('first_pass_complete_pairs', 0)))
          approved = int(review.get('approved_pairs', 0))
          pending_reviews = int(review.get('pending_pairs', total - reviewed))
          pending_translation = int(state.get('pending', 1))
          if state.get('status') != 'translation-complete' or pending_translation != 0:
              raise SystemExit(f'Translation incomplete: {state}')
          if total != 77 or reviewed != 77 or approved != 77 or pending_reviews != 0:
              raise SystemExit(
                  f'Linguistic approval incomplete: total={total}, reviewed={reviewed}, approved={approved}, pending={pending_reviews}'
              )
          PY
      - name: Install document dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install beautifulsoup4 markdown python-docx pillow pymupdf lxml
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-dejavu-core
      - name: Build public pages and all five document formats
        run: |
          python3 tools/temporary-5.txt
          python3 tools/temporary-2.txt
          python3 tools/temporary-6.txt
      - name: Run final release QA
        run: |
          python3 tools/final_release_qa.py --scan
          git diff --check
      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization site docs reports
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved four-language release"
            git push
          fi
