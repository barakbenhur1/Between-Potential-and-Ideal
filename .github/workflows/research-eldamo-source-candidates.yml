name: Research Eldamo Source Candidates

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/research-eldamo-source-candidates.yml"
      - "tools/extract_eldamo_source_candidates.py"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          show-progress: false
          sparse-checkout: tools/extract_eldamo_source_candidates.py
          sparse-checkout-cone-mode: false
      - name: Extract pinned Eldamo entries for tamma and pusta
        run: python3 tools/extract_eldamo_source_candidates.py tamma pusta
