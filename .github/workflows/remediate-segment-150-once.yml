name: Remediate segment 150 once

on:
  push:
    branches: [localization-release-resolved]
    paths:
      - .github/workflows/remediate-segment-150-once.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
      - name: Apply exact reviewed replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('localization/sources')
          tlh = root / 'tlh/between-potential-and-ideal/150-self-ego-unity-part-2.md'
          qya = root / 'qya/between-potential-and-ideal/150-self-ego-unity-part-2.md'

          t = tlh.read_text(encoding='utf-8')
          expected_tlh = {'representation': 6, 'mirror': 5, 'theory': 1}
          actual_tlh = {k: t.count(k) for k in expected_tlh}
          if actual_tlh != expected_tlh:
              raise SystemExit(f'Unexpected Klingon counts: {actual_tlh}')
          t = t.replace('status: draft\n', 'status: draft\nlinguistic_review: specialist-revision-active\nreview_record: localization/reviews/between-potential-and-ideal/150-self-ego-unity-part-2-review.md\n', 1)
          t = t.replace('representation', 'lIw')
          t = t.replace('mirror', 'leghmeH jan')
          t = t.replace('theory', 'QubmeH mIw')
          tlh.write_text(t, encoding='utf-8')

          q = qya.read_text(encoding='utf-8')
          expected_qya = {'representation': 2, 'Representation': 1, 'code': 1}
          actual_qya = {k: q.count(k) for k in expected_qya}
          if actual_qya != expected_qya:
              raise SystemExit(f'Unexpected Neo-Quenya counts: {actual_qya}')
          q = q.replace('status: draft\n', 'status: draft\nlinguistic_review: specialist-revision-active\nreview_record: localization/reviews/between-potential-and-ideal/150-self-ego-unity-part-2-review.md\n', 1)
          q = q.replace('Representation', 'Emma').replace('representation', 'emma')
          q = q.replace('diagnostic code', 'diagnostic tengwië')
          qya.write_text(q, encoding='utf-8')
          PY

          test "$(git hash-object localization/sources/tlh/between-potential-and-ideal/150-self-ego-unity-part-2.md)" = "262ae0d2ea38ecbcd57b5e4f73a403d3f466d8f1"
          test "$(git hash-object localization/sources/qya/between-potential-and-ideal/150-self-ego-unity-part-2.md)" = "0ae03f45522345d6af6d9cccce3bb749bba5a5b8"
          rm .github/workflows/remediate-segment-150-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remediate segment 150 paired sources'
          git push origin HEAD:localization-release-resolved
