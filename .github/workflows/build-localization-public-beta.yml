name: Build Localization Public Beta

on:
  push:
    branches:
      - localization-release-resolved
    paths:
      - localization/sources/tlh/**
      - localization/sources/qya/**
      - localization/documents/between-potential-and-ideal.json
      - tools/build_localization_beta.py
      - .github/workflows/build-localization-public-beta.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localization-public-beta
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install document builders
        run: python3 -m pip install --disable-pip-version-check markdown python-docx reportlab
      - name: Build complete public beta packages
        run: python3 tools/build_localization_beta.py
      - name: Verify all beta siblings
        run: |
          set -euo pipefail
          for lang in tlh qya; do
            for ext in html pdf docx md txt; do
              test -s "site/files/$lang/between-potential-and-ideal-$lang.$ext"
            done
            test -s "site/$lang.html"
          done
          test -s localization/beta-release-manifest.json
      - name: Commit generated beta packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/tlh.html site/qya.html site/files/tlh site/files/qya localization/beta-release-manifest.json
          if git diff --cached --quiet; then
            echo "Public beta packages are current."
            exit 0
          fi
          git commit -m "Publish Klingon and Neo-Quenya public beta packages"
          git push origin HEAD:localization-release-resolved
