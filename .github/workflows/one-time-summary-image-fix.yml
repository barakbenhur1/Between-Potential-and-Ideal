name: One-time summary image HTML fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-summary-image-fix.yml'

permissions:
  contents: write

jobs:
  fix-summary-image-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Rewrite summary pages to use the requested tab image directly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('site/pages/he/summary.html'),
              Path('site/pages/en/summary-en.html'),
          ]

          replacements = {
              'content="figures/tab_core_unique.png" property="og:image"': 'content="figures/tab_applied.png" property="og:image"',
              'src="../../figures/tab_core_unique.png"': 'src="../../figures/tab_applied.png"',
              'src="../../figures/thumb_core.png"': 'src="../../figures/thumb_applied.png"',
              'איור תקציר: דרך בהירה בין שכבות נוף ושערים מופשטים': 'איור תקציר: מעבר בין שכבות, שערים וגשר אל מסלול הקריאה',
              'Summary illustration: a clear path between landscape layers and abstract gates': 'Summary illustration: passages, layers, gates, and a bridge into the reading path',
          }

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              print(f'{path}: changed={text != original}')
          PY

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/one-time-summary-image-fix.yml

      - name: Commit direct HTML summary image fix
        run: |
          git config user.name "Barak Ben Hur via ChatGPT"
          git config user.email "barakbenhur@gmail.com"
          if ! git diff --quiet; then
            git add site/pages/he/summary.html site/pages/en/summary-en.html .github/workflows/one-time-summary-image-fix.yml
            git commit -m "Point summary HTML to requested tab image"
            git push
          else
            echo "No changes to commit"
          fi
