name: Release Guard

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run final release QA
        run: |
          rm -rf reports tools/__pycache__
          python3 tools/final_release_qa.py --scan
          git diff --check

      - name: Upload release guard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-guard-diagnostics-${{ github.sha }}
          path: reports/production_next/
          if-no-files-found: warn
          retention-days: 7
