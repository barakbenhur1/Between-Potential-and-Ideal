name: Release Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run final release QA
        run: |
          rm -rf reports tools/__pycache__
          python3 tools/final_release_qa.py --scan
          git diff --check
