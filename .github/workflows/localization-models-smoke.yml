name: Localization Models Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  models: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Create tiny input
        run: |
          mkdir -p reports/localization/diagnostic
          echo '{"source":"Hello"}' > reports/localization/diagnostic/tiny.json
      - id: prompt_file
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/localization-batch.prompt.yml
          input: |
            job_id: diagnostic
            language_mode: tlh
          file_input: |
            job: reports/localization/diagnostic/tiny.json
