name: Localization Models Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/localization-models-smoke.yml"

permissions:
  contents: write
  models: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: inference
        uses: actions/ai-inference@v1
        with:
          prompt: "Return exactly GITHUB_MODELS_OK and nothing else."
          model: openai/gpt-4o-mini
          max-tokens: 16
          temperature: 0
      - name: Verify result
        env:
          RESPONSE: ${{ steps.inference.outputs.response }}
        run: |
          printf '%s\n' "$RESPONSE"
          test "$RESPONSE" = "GITHUB_MODELS_OK"
