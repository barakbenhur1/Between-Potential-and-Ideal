name: Localization Models Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - id: inference
        uses: actions/ai-inference@v1
        with:
          prompt: "Return exactly GITHUB_MODELS_OK and nothing else."
          model: openai/gpt-4o-mini
          max-completion-tokens: 16
          temperature: 0
      - name: Verify result
        env:
          RESPONSE: ${{ steps.inference.outputs.response }}
        run: test "$RESPONSE" = "GITHUB_MODELS_OK"
