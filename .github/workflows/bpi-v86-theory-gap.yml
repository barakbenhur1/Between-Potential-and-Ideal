name: BPI V86 theory cover TOC gap repair

# Trigger marker: 2026-05-26 close logical-cover gap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fix_theory_cover_toc_gap.py'
      - 'site/files/editorial-tightened/**'
      - 'site/files/**/*.html'
      - '.github/workflows/bpi-v86-theory-gap.yml'

permissions:
  contents: write

jobs:
  repair-theory-gap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc python3-pip python3-dev python3-cffi libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install weasyprint pymupdf

      - name: Apply V86 gap repair
        run: python3 tools/fix_theory_cover_toc_gap.py

      - name: Commit generated theory files
        run: |
          git config user.name "bpi-layout-bot"
          git config user.email "actions@github.com"
          git add site/files _product_docs/reports || true
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Close theory cover TOC gap"
            git push
          fi
