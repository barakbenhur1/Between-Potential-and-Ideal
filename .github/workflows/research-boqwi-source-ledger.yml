name: Research boQwI Source Ledger

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/research-boqwi-source-ledger.yml"
      - "tools/extract_boqwi_source_ledger.py"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Extract source ledger from pinned boQwI data
        run: |
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/barakbenhur1/Between-Potential-and-Ideal/b64e76e739c6a170372bc73a93595b5ed3002ef5/tools/extract_boqwi_source_ledger.py" \
            --output /tmp/extract_boqwi_source_ledger.py
          python3 /tmp/extract_boqwi_source_ledger.py
