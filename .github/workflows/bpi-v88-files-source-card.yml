# Push trigger disabled by BPI ideal fixer to prevent one-time workflow regressions.
name: BPI V88 files source-card dedupe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-files-source-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: python3 -m pip install beautifulsoup4

      - name: Apply files source-card dedupe
        run: python3 tools/fix_files_source_cards.py

      - name: Commit generated changes
        run: |
          git config user.name "bpi-layout-bot"
          git config user.email "actions@github.com"
          git add site/pages/he/files.html site/pages/en/files-en.html _product_docs/reports/BPI_V88_FILES_SOURCE_CARD_DEDUPE_REPORT_HE.md || true
          if git diff --cached --quiet; then
            echo "No files source-card changes to commit."
          else
            git commit -m "Show only non-duplicated source file formats"
            git push
          fi
