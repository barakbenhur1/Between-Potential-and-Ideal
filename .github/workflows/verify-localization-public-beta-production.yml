name: Verify Localization Public Beta Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-localization-public-beta-production.yml
      - tools/verify_localization_public_beta_production.py
      - localization/beta-release-manifest.json
      - site/index.html
      - site/en.html
      - site/assets/bpi-four-language-localization.css
      - site/tlh.html
      - site/qya.html
      - site/sitemap.xml
      - site/files/tlh/**
      - site/files/qya/**
  workflow_run:
    workflows: ["Build Full Localized Site"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-localization-public-beta-production
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify language menu, deployment, review links, and exact package hashes
        run: python3 tools/verify_localization_public_beta_production.py
      - name: Commit authoritative production verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f site/localization-public-beta-production-status.json
          git add site/localization-public-beta-production-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record current public beta production verification"
          git push origin HEAD:main
