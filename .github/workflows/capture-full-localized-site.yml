name: Capture Full Localized Site
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-full-localized-site.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install --disable-pip-version-check markdown beautifulsoup4
      - run: python3 tools/build_localized_public_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: full-localized-site
          path: |
            site/tlh.html
            site/qya.html
            site/pages/tlh
            site/pages/qya
            localization/site-language-parity-manifest.json
          if-no-files-found: error
          retention-days: 3
