name: Assemble segment 140 Klingon once

on:
  push:
    branches: [localization-release-resolved]
    paths:
      - .github/workflows/assemble-segment-140-tlh-once.yml

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
      - name: Assemble reviewed Klingon source
        shell: bash
        run: |
          cat \
            localization/staging/tlh-140-part-1.txt \
            localization/staging/tlh-140-part-2.txt \
            localization/staging/tlh-140-part-3a.txt \
            localization/staging/tlh-140-part-3b.txt \
            localization/staging/tlh-140-part-4a1.txt \
            localization/staging/tlh-140-part-4a2.txt \
            localization/staging/tlh-140-part-4b.txt \
            > localization/sources/tlh/between-potential-and-ideal/140-self-ego-unity-part-1.md
          rm localization/staging/tlh-140-part-*.txt
          rm .github/workflows/assemble-segment-140-tlh-once.yml
          git diff --check
          test "$(git hash-object localization/sources/tlh/between-potential-and-ideal/140-self-ego-unity-part-1.md)" = "b8ed19279acec2115eada13db81ad388638ee4c3"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble segment 140 Klingon source'
          git push origin HEAD:localization-release-resolved
