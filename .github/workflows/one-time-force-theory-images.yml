name: One-time forced theory image replacement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-force-theory-images.yml'

permissions:
  contents: write

jobs:
  force-theory-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Force image replacements inside theory files, not tab pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          from collections import defaultdict

          FIGURES = Path('site/figures')
          ROOTS = [Path('site/files')]
          REPORT = Path('docs/theory-file-forced-image-replacements.md')
          REPORT.parent.mkdir(parents=True, exist_ok=True)

          TEXT_EXTS = {'.html', '.htm', '.md', '.txt'}
          TARGET_BLACK = FIGURES / 'v25_chapter_black-holes-horizons-holography_v2.svg'
          TARGET_SUMMARY = FIGURES / 'tab_applied.png'
          TARGET_HOME_HERO = FIGURES / 'cover_philosophical_recursion_whole_diagram.png'

          OLD_BLACK_BASENAMES = {
              'v25_chapter_black-holes-horizons-holography.png',
              'v25_chapter_black-holes-horizons-holography_v1.png',
              'v25_chapter_black-holes-horizons-holography_old.png',
          }
          # Summary/core duplication: only used when nearby text says summary/overview, so it will not touch core chapters.
          SUMMARY_DUPLICATE_BASENAMES = {
              'tab_core_unique.png',
              'thumb_core.png',
          }
          SUMMARY_WORDS = ('תקציר', 'summary', 'overview', 'מסלול קריאה', 'reading path')

          # Use the strong homepage/hero image in theory-file cover/opening locations where a generic repeated cover image is used.
          # This is conservative: it only changes cover/opening contexts, not every repeated chapter use.
          COVER_WORDS = ('שער', 'פתיחה', 'cover', 'opening', 'introduction', 'מבוא')
          GENERIC_COVER_BASENAMES = {
              'aab93130711c.jpg',
              '640310673eac.jpg',
          }

          def is_text_file(path: Path) -> bool:
              return path.is_file() and path.suffix.lower() in TEXT_EXTS

          def in_scope(path: Path) -> bool:
              if not is_text_file(path): return False
              return any(root in path.parents for root in ROOTS)

          def rel_from(path: Path, target: Path) -> str:
              return os.path.relpath(target, start=path.parent).replace(os.sep, '/')

          def basename_from_ref(ref: str) -> str:
              clean = ref.split('?',1)[0].split('#',1)[0]
              return os.path.basename(clean)

          def context_has(text: str, words) -> bool:
              low = text.lower()
              return any(w.lower() in low for w in words)

          changed = defaultdict(list)

          for path in sorted(p for root in ROOTS for p in root.rglob('*') if in_scope(p)):
              old_text = path.read_text(encoding='utf-8', errors='ignore')
              text = old_text
              black_rel = rel_from(path, TARGET_BLACK)
              summary_rel = rel_from(path, TARGET_SUMMARY)
              home_rel = rel_from(path, TARGET_HOME_HERO)

              # 1) Hard replacement for black-hole/holography image by filename everywhere inside theory files.
              #    This changes the filename too, so browser/PDF generator cache cannot keep the old visual.
              for old_base in OLD_BLACK_BASENAMES:
                  # HTML src/href and markdown image paths can have arbitrary relative prefixes.
                  pattern = re.compile(r'((?:\.\./|\.\/|/)?(?:[^\s"\'\)<>]*/)?%s)' % re.escape(old_base))
                  if old_base in text:
                      text = pattern.sub(black_rel, text)
                      changed[str(path)].append(f'{old_base} -> {black_rel}')

              # 2) Summary image duplication: replace only image refs whose surrounding block/line is about summary.
              if path.suffix.lower() in {'.html', '.htm'}:
                  def patch_tag_or_figure(m):
                      block = m.group(0)
                      base_hits = [b for b in SUMMARY_DUPLICATE_BASENAMES if b in block]
                      if base_hits and context_has(block, SUMMARY_WORDS):
                          out = block
                          for b in base_hits:
                              out = re.sub(r'((?:\.\./|\.\/|/)?(?:[^\s"\'\)<>]*/)?%s)' % re.escape(b), summary_rel, out)
                          if out != block:
                              changed[str(path)].append(f'summary duplicate image {base_hits} -> {summary_rel}')
                          return out
                      # Cover/opening generic repeated image -> homepage hero image, only when the block is clearly cover/opening.
                      cover_hits = [b for b in GENERIC_COVER_BASENAMES if b in block]
                      if cover_hits and context_has(block, COVER_WORDS):
                          out = block
                          for b in cover_hits:
                              out = re.sub(r'((?:\.\./|\.\/|/)?(?:[^\s"\'\)<>]*/)?%s)' % re.escape(b), home_rel, out)
                          if out != block:
                              changed[str(path)].append(f'cover/opening generic image {cover_hits} -> {home_rel}')
                          return out
                      return block
                  text = re.sub(r'<figure\b[^>]*>.*?</figure>|<img\b[^>]*>', patch_tag_or_figure, text, flags=re.I|re.S)
              else:
                  lines = text.splitlines(keepends=True)
                  out_lines = []
                  for i, line in enumerate(lines):
                      context = ''.join(lines[max(0,i-3):min(len(lines),i+4)])
                      if context_has(context, SUMMARY_WORDS) and any(b in line for b in SUMMARY_DUPLICATE_BASENAMES):
                          old_line = line
                          for b in SUMMARY_DUPLICATE_BASENAMES:
                              line = re.sub(r'((?:\.\./|\.\/|/)?(?:[^\s"\'\)<>]*/)?%s)' % re.escape(b), summary_rel, line)
                          if line != old_line:
                              changed[str(path)].append(f'summary duplicate markdown/text image -> {summary_rel}')
                      if context_has(context, COVER_WORDS) and any(b in line for b in GENERIC_COVER_BASENAMES):
                          old_line = line
                          for b in GENERIC_COVER_BASENAMES:
                              line = re.sub(r'((?:\.\./|\.\/|/)?(?:[^\s"\'\)<>]*/)?%s)' % re.escape(b), home_rel, line)
                          if line != old_line:
                              changed[str(path)].append(f'cover/opening generic markdown/text image -> {home_rel}')
                      out_lines.append(line)
                  text = ''.join(out_lines)

              if text != old_text:
                  path.write_text(text, encoding='utf-8')

          # Verify remaining old black-hole filename references in text files.
          remaining = []
          for path in sorted(p for root in ROOTS for p in root.rglob('*') if in_scope(p)):
              txt = path.read_text(encoding='utf-8', errors='ignore')
              for b in OLD_BLACK_BASENAMES:
                  if b in txt:
                      remaining.append((str(path), b))

          lines = ['# Forced theory-file image replacements', '', 'Scope: `site/files/**` only. Public tab pages were not edited by this pass.', '']
          lines.append('## Changed files')
          if changed:
              for file, entries in sorted(changed.items()):
                  lines.append(f'- `{file}`')
                  for entry in entries:
                      lines.append(f'  - {entry}')
          else:
              lines.append('- No text-based theory files changed.')
          lines.append('')
          lines.append('## Remaining old black-hole image filename references')
          if remaining:
              for file, b in remaining:
                  lines.append(f'- `{file}` still contains `{b}`')
          else:
              lines.append('- None found in text-based theory files.')
          lines.append('')
          lines.append('## Important limit')
          lines.append('- HTML/MD/TXT were edited directly. PDF/DOCX files are binary outputs; they must be regenerated or their embedded media must be replaced separately if they still show old embedded images.')
          REPORT.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          print('\n'.join(lines))
          PY

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/one-time-force-theory-images.yml

      - name: Commit forced theory-file image replacements
        run: |
          git config user.name "Barak Ben Hur via ChatGPT"
          git config user.email "barakbenhur@gmail.com"
          if ! git diff --quiet; then
            git add site/files docs/theory-file-forced-image-replacements.md .github/workflows/one-time-force-theory-images.yml
            git commit -m "Force theory file image replacements"
            git push
          else
            echo "No changes to commit"
          fi
