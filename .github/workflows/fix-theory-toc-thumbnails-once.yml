# Push trigger disabled by BPI ideal fixer to prevent one-time workflow regressions.
name: Apply theory TOC thumbnails

on:
  workflow_dispatch:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-theory-toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add thumbnails only to visible main theory chapter rows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re

          TARGETS = [
            (Path('site/files/between-potential-and-ideal-he-editorial.html'), 'rtl'),
            (Path('site/files/between-potential-and-ideal-en-editorial.html'), 'ltr'),
            (Path('site/files/between-potential-and-ideal-tightened-he.html'), 'rtl'),
            (Path('site/files/between-potential-and-ideal-tightened-en.html'), 'ltr'),
          ]

          STYLE_ID = 'v122-visible-theory-main-chapter-toc-thumbnails'
          CSS = f'''
          <style id="{STYLE_ID}">
          /* V122 — visible theory TOC thumbnails: main chapters only, image from each chapter body. */
          #interactive-toc{{text-align:start!important;}}
          html[dir="rtl"] #interactive-toc,#interactive-toc[dir="rtl"]{{text-align:right!important;}}
          html[dir="ltr"] #interactive-toc,#interactive-toc[dir="ltr"]{{text-align:left!important;}}
          #interactive-toc .theory-toc-main-row{{display:block!important;margin:0!important;padding:.48rem 0!important;border-block-start:1px solid rgba(197,121,29,.22)!important;text-align:inherit!important;direction:inherit!important;list-style:none!important;}}
          #interactive-toc .theory-toc-main-row:first-child{{border-block-start:0!important;}}
          #interactive-toc .theory-toc-entry{{display:inline-flex!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;width:auto!important;max-width:100%!important;min-height:42px!important;margin:0!important;padding:0!important;color:#08737a!important;text-decoration:none!important;vertical-align:middle!important;direction:inherit!important;text-align:inherit!important;}}
          #interactive-toc .theory-toc-thumb{{display:block!important;flex:0 0 58px!important;width:58px!important;min-width:58px!important;height:40px!important;object-fit:cover!important;object-position:center center!important;border-radius:8px!important;border:1px solid rgba(10,58,104,.13)!important;background:#fffaf0!important;box-shadow:0 3px 9px rgba(20,40,60,.07)!important;margin:0!important;}}
          #interactive-toc .theory-toc-title{{display:block!important;min-width:0!important;color:#08737a!important;font-size:22px!important;line-height:1.25!important;font-weight:700!important;text-align:inherit!important;direction:inherit!important;white-space:normal!important;}}
          #interactive-toc .theory-toc-entry:hover .theory-toc-title,#interactive-toc .theory-toc-entry:focus .theory-toc-title{{text-decoration:underline!important;text-decoration-thickness:1px!important;text-underline-offset:.18em!important;}}
          @media print{{#interactive-toc .theory-toc-main-row{{padding:.3rem 0!important;}}#interactive-toc .theory-toc-thumb{{flex-basis:18mm!important;width:18mm!important;min-width:18mm!important;height:12mm!important;border-radius:2.2mm!important;box-shadow:none!important;}}#interactive-toc .theory-toc-title{{font-size:12.5pt!important;}}}}
          </style>
          '''.strip()

          STYLE_RE = re.compile(r'\n?\s*<style id="v12[0-9][^"]*theory[^>]*toc[^>]*>.*?</style>', re.S | re.I)
          HEAD_RE = re.compile(r'</head>', re.I)
          TOC_RE = re.compile(r'(<section\b[^>]*\bid=["\']interactive-toc["\'][^>]*>)(?P<body>.*?)(</section>)', re.S | re.I)
          LI_RE = re.compile(r'<li(?P<attrs>[^>]*)>(?P<body>.*?)</li>', re.S | re.I)
          A_RE = re.compile(r'<a\b(?P<attrs>[^>]*\bhref=["\']#(?P<id>[^"\']+)["\'][^>]*)>(?P<label>.*?)</a>', re.S | re.I)
          HEADING_RE_TEMPLATE = r'<h(?P<level>[1-6])\b[^>]*\bid=["\']{id}["\'][^>]*>(?P<body>.*?)</h(?P=level)>'
          IMG_RE = re.compile(r'<img\b[^>]*\bsrc=["\'](?P<src>[^"\']+)["\'][^>]*>', re.I | re.S)
          TAG_RE = re.compile(r'<[^>]+>', re.S)
          WS_RE = re.compile(r'\s+')

          def clean_text(fragment):
            fragment = IMG_RE.sub('', fragment)
            fragment = TAG_RE.sub('', fragment)
            return WS_RE.sub(' ', html.unescape(fragment)).strip()

          def heading_for_id(text, target_id):
            m = re.search(HEADING_RE_TEMPLATE.format(id=re.escape(target_id)), text, re.S | re.I)
            if not m:
              return None
            return m.start(), m.end(), int(m.group('level')), clean_text(m.group('body'))

          def is_main_chapter(label, heading_title, level):
            title = (heading_title or label or '').strip()
            label = (label or '').strip()
            if level not in (1, 2):
              return False
            return (
              title.startswith('פרק ') or
              label.startswith('פרק ') or
              re.match(r'^Chapter\b', title, re.I) is not None or
              re.match(r'^Chapter\b', label, re.I) is not None
            )

          def first_image_in_chapter(text, heading_end, level):
            stop_re = re.compile(r'<h[1-' + str(level) + r']\b[^>]*\bid=["\'][^"\']+["\'][^>]*>', re.I | re.S)
            stop = stop_re.search(text, heading_end)
            end = stop.start() if stop else len(text)
            chunk = text[heading_end:end]
            for img in IMG_RE.finditer(chunk):
              src = img.group('src')
              low = src.lower()
              if any(skip in low for skip in ('cover', 'logo', 'favicon', 'apple-touch-icon')):
                continue
              return src
            first = IMG_RE.search(chunk)
            return first.group('src') if first else None

          def strip_old_toc_markup(toc_body):
            toc_body = re.sub(r'<img\b[^>]*class=["\'][^"\']*theory-toc-thumb[^"\']*["\'][^>]*>', '', toc_body, flags=re.S | re.I)
            toc_body = re.sub(r'<span\b[^>]*class=["\'][^"\']*theory-toc-title[^"\']*["\'][^>]*>(.*?)</span>', r'\1', toc_body, flags=re.S | re.I)
            toc_body = re.sub(r'\s*class=["\']theory-toc-entry["\']', '', toc_body, flags=re.I)
            toc_body = re.sub(r'\s*class=["\']theory-toc-main-row["\']', '', toc_body, flags=re.I)
            return toc_body

          def patch_toc(text, direction):
            align = 'right' if direction == 'rtl' else 'left'
            entry_style = f'display:inline-flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;width:auto!important;max-width:100%!important;min-height:42px!important;margin:0!important;padding:0!important;color:#08737a!important;text-decoration:none!important;vertical-align:middle!important;direction:{direction}!important;text-align:{align}!important;'
            row_style = f'display:block!important;margin:0!important;padding:.48rem 0!important;border-block-start:1px solid rgba(197,121,29,.22)!important;direction:{direction}!important;text-align:{align}!important;list-style:none!important;'
            img_style = 'display:block!important;flex:0 0 58px!important;width:58px!important;min-width:58px!important;height:40px!important;object-fit:cover!important;object-position:center center!important;border-radius:8px!important;border:1px solid rgba(10,58,104,.13)!important;background:#fffaf0!important;box-shadow:0 3px 9px rgba(20,40,60,.07)!important;margin:0!important;'
            title_style = f'display:block!important;min-width:0!important;color:#08737a!important;font-size:22px!important;line-height:1.25!important;font-weight:700!important;direction:{direction}!important;text-align:{align}!important;white-space:normal!important;'

            def replace_toc(toc_match):
              body = strip_old_toc_markup(toc_match.group('body'))

              def replace_li(li_match):
                li_body = li_match.group('body')
                a = A_RE.search(li_body)
                if not a:
                  return li_match.group(0)
                target_id = html.unescape(a.group('id'))
                label = clean_text(a.group('label'))
                h = heading_for_id(text, target_id)
                if not h:
                  return li_match.group(0)
                _, heading_end, level, heading_title = h
                if not is_main_chapter(label, heading_title, level):
                  return li_match.group(0)
                src = first_image_in_chapter(text, heading_end, level)
                if not src:
                  return li_match.group(0)
                new_a = (
                  f'<a class="theory-toc-entry" href="#{html.escape(target_id, quote=True)}" style="{entry_style}">'
                  f'<img class="theory-toc-thumb" src="{html.escape(src, quote=True)}" alt="" loading="lazy" decoding="async" style="{img_style}"/>'
                  f'<span class="theory-toc-title" style="{title_style}">{html.escape(label)}</span>'
                  f'</a>'
                )
                new_body = A_RE.sub(new_a, li_body, count=1)
                return f'<li class="theory-toc-main-row" style="{row_style}">' + new_body + '</li>'

              new_body = LI_RE.sub(replace_li, body)
              return toc_match.group(1) + new_body + toc_match.group(3)

            return TOC_RE.sub(replace_toc, text, count=1)

          changed = []
          for path, direction in TARGETS:
            if not path.exists():
              print(f'missing target: {path}')
              continue
            old = path.read_text(encoding='utf-8')
            new = STYLE_RE.sub('', old)
            new = patch_toc(new, direction)
            if HEAD_RE.search(new):
              new = HEAD_RE.sub(CSS + '\n</head>', new, count=1)
            if new != old:
              path.write_text(new, encoding='utf-8')
              changed.append(str(path))

          print('patched files:')
          for item in changed:
            print(item)
          if not changed:
            print('no changes needed')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/files/between-potential-and-ideal-he-editorial.html site/files/between-potential-and-ideal-en-editorial.html site/files/between-potential-and-ideal-tightened-he.html site/files/between-potential-and-ideal-tightened-en.html
          git commit -m "Add TOC thumbnails to visible theory files"
          git push
