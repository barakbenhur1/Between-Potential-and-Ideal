name: Create approved restore tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-approved-restore-tag.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable restore tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="restore-mobile-nav-match-english-2026-06-06"
          TARGET="5108e8134f03c8cfa78b9b0bcb7fa0aa1d662443"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag already exists: ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${TARGET}" -m "Approved restore point: Hebrew mobile header and tab bar match English"
          git push origin "refs/tags/${TAG}"
