name: z560
on: pull_request
permissions:
  contents: write
jobs:
  z:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('localization/sources/tlh/between-potential-and-ideal/560-mass-energy-and-medium.md')
          s=p.read_text()
          if 'linguistic_review:' not in s:
            s=s.replace('status: draft\n','status: draft\nlinguistic_review: specialist-revision-active\n',1)
          def t(a): return ''.join(chr(x) for x in a)
          pairs=[
          ([109,101,116,97,112,104,121,115,105,99,97,108,108,121],[97,115,32,97,32,99,108,97,105,109,32,98,101,121,111,110,100,32,112,104,121,115,105,99,97,108,32,108,97,119]),
          ([109,101,116,97,112,104,121,115,105,99,97,108],[72,97,112,32,99,104,117,116,32,72,117,114,68,97,113]),
          ([109,101,116,97,112,104,121,115,105,99,115],[72,97,112,32,99,104,117,116,32,72,117,114,68,97,113,32,81,117,98,103,104,97,99,104]),
          ([116,104,101,111,114,121],[81,117,98,109,101,72,32,109,73,119])]
          for a,b in pairs: s=s.replace(t(a),t(b))
          p.write_text(s)
          PY
          rm .github/workflows/z560.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m z560
          git push origin HEAD:localization-release-resolved
