name: Fix 170 line break once

on:
  push:
    branches: [localization-release-resolved]
    paths: [.github/workflows/fix-170-line-break-once.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
      - name: Insert missing paragraph separator
        shell: bash
        run: |
          FILE=localization/sources/tlh/between-potential-and-ideal/170-ai-mirror-existence-navigation.md
          sed -i '45i\' "$FILE"
          test "$(sed -n '45p' "$FILE")" = ""
          rm .github/workflows/fix-170-line-break-once.yml
          git diff --check
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'Separate segment 170 final prose block'
          git push origin HEAD:localization-release-resolved
