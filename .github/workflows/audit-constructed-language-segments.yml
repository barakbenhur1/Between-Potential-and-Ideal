name: Audit Constructed-Language Segments

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/audit_constructed_language_segments.py"
      - "localization/sources/tlh/**"
      - "localization/sources/qya/**"
      - ".github/workflows/audit-constructed-language-segments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2
      - name: Apply one-time Neo-Quenya repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = next(Path('localization/sources/qya/between-potential-and-ideal').glob('220-*.md'))
          lines = path.read_text(encoding='utf-8').splitlines()

          words = lines[18].split()
          words[53:55] = ['palar', 'ovantiéo']
          lines[18] = ' '.join(words)

          words = lines[30].split()
          words[19] = 'poitaliéo'
          words[57] = 'tengwië'
          lines[30] = ' '.join(words)

          words = lines[36].split()
          words[16:18] = ['Palar', 'ovantiéo']
          lines[36] = ' '.join(words)

          words = lines[38].split()
          words[36:38] = ['palar', 'ovantiéo']
          words[42:44] = ['Palar', 'ovantiéo']
          lines[38] = ' '.join(words)

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git checkout HEAD^ -- .github/workflows/audit-constructed-language-segments.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'Repair segment 220 Neo-Quenya terminology'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all paired segments
        run: python3 tools/audit_constructed_language_segments.py
      - uses: actions/upload-artifact@v4
        with:
          name: constructed-language-paired-audit
          path: reports/localization/constructed-language-audit/
          if-no-files-found: error
          retention-days: 14
