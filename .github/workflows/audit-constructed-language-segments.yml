name: Audit Constructed-Language Segments

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/audit_constructed_language_segments.py"
      - "localization/sources/tlh/**"
      - "localization/sources/qya/**"
      - ".github/workflows/audit-constructed-language-segments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2
      - name: Apply one-time Klingon repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = next(Path('localization/sources/tlh/between-potential-and-ideal').glob('210-*.md'))
          lines = path.read_text(encoding='utf-8').splitlines()

          words = lines[32].split()
          words[57:58] = ['wab', 'pat']
          lines[32] = ' '.join(words)

          words = lines[44].split()
          words[28:30] = ['QanmeH', 'patmey,']
          lines[44] = ' '.join(words)

          words = lines[46].split()
          words[13:15] = ["ghu'", 'lojmIt,']
          lines[46] = ' '.join(words)

          words = lines[50].split()
          words[6:8] = ["ghu'", 'lojmIt,']
          lines[50] = ' '.join(words)

          words = lines[64].split()
          words[4:6] = ['chenDaj', 'teH']
          lines[64] = ' '.join(words)

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git checkout HEAD^ -- .github/workflows/audit-constructed-language-segments.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'Repair segment 210 Klingon terminology'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all paired segments
        run: python3 tools/audit_constructed_language_segments.py
      - uses: actions/upload-artifact@v4
        with:
          name: constructed-language-paired-audit
          path: reports/localization/constructed-language-audit/
          if-no-files-found: error
          retention-days: 14
