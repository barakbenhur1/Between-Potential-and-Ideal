name: Audit Constructed-Language Segments

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/audit_constructed_language_segments.py"
      - "localization/sources/tlh/**"
      - "localization/sources/qya/**"
      - ".github/workflows/audit-constructed-language-segments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2
      - name: Apply one-time segment 250 remediation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('localization/sources')
          tlh = root / 'tlh/between-potential-and-ideal/250-recursive-edge.md'
          qya = root / 'qya/between-potential-and-ideal/250-recursive-edge.md'

          tlh_text = tlh.read_text(encoding='utf-8')
          tlh_text = re.sub(r"(?<![\w'-])theory(?![\w'-])", 'QubmeH mIw', tlh_text, flags=re.I)
          tlh_text = re.sub(r"(?<![\w'-])logic(?![\w'-])", 'meq chut', tlh_text, flags=re.I)
          tlh_text = re.sub(r"(?<![\w'-])representation(?![\w'-])", 'lIw', tlh_text, flags=re.I)
          tlh.write_text(tlh_text, encoding='utf-8')

          qya_text = qya.read_text(encoding='utf-8')
          qya_text = re.sub(r"(?<![\w'-])representation(?![\w'-])", 'emma', qya_text, flags=re.I)
          qya.write_text(qya_text, encoding='utf-8')
          PY
          git checkout HEAD^ -- .github/workflows/audit-constructed-language-segments.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add .github/workflows/audit-constructed-language-segments.yml \
            localization/sources/tlh/between-potential-and-ideal/250-recursive-edge.md \
            localization/sources/qya/between-potential-and-ideal/250-recursive-edge.md
          if ! git diff --cached --quiet; then
            git commit -m 'Remediate segment 250'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all paired segments
        run: python3 tools/audit_constructed_language_segments.py
      - uses: actions/upload-artifact@v4
        with:
          name: constructed-language-paired-audit
          path: reports/localization/constructed-language-audit/
          if-no-files-found: error
          retention-days: 14
