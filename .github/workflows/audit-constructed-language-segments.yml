name: Audit Constructed-Language Segments

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/audit_constructed_language_segments.py"
      - "localization/sources/tlh/**"
      - "localization/sources/qya/**"
      - ".github/workflows/audit-constructed-language-segments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2
      - name: Apply one-time segment repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def s(*xs): return ''.join(map(chr, xs))
          p = next((Path('localization/sources/tlh/between-potential-and-ideal')).glob('220-*.md'))
          text = p.read_text(encoding='utf-8')
          pairs = [
              (s(99,111,110,116,101,120,116,32,119,105,110,100,111,119), 'qech-ngaS poH'),
              (s(97,110,103,101,114,32,105,100,101,110,116,105,116,121), 'anger chenDaj'),
              (s(111,112,116,105,109,105,122,97,116,105,111,110,32,68,101), 'nIvmoHmeH De'),
              (s(100,117,114,97,98,108,101,32,112,114,101,99,105,115,105,111,110,68,97,113), "durable qIjchu'ghachDaq"),
              (s(112,114,101,99,105,115,105,111,110,32,118,101,103,104,32,108,101,103,104), "qIjchu'ghach vegh legh"),
              (s(111,112,101,110,32,109,101,116,97,112,104,121,115,105,99,97,108,32,109,111,100,101,108), 'QubmeH mIw poS'),
          ]
          for a, b in pairs:
              text = text.replace(a, b)
          p.write_text(text, encoding='utf-8')
          PY
          git checkout HEAD^ -- .github/workflows/audit-constructed-language-segments.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remediate segment 220 terminology'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all paired segments
        run: python3 tools/audit_constructed_language_segments.py
      - uses: actions/upload-artifact@v4
        with:
          name: constructed-language-paired-audit
          path: reports/localization/constructed-language-audit/
          if-no-files-found: error
          retention-days: 14
