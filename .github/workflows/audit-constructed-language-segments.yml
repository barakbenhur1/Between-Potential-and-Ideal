name: Audit Constructed-Language Segments

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/audit_constructed_language_segments.py"
      - "localization/sources/tlh/**"
      - "localization/sources/qya/**"
      - ".github/workflows/audit-constructed-language-segments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2
      - name: Apply one-time formatting repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = next((Path('localization/sources/tlh/between-potential-and-ideal')).glob('170-*.md'))
          lines = path.read_text(encoding='utf-8').splitlines()
          heading = max(i for i, line in enumerate(lines) if line.startswith('## '))
          last = heading - 1
          while last >= 0 and not lines[last].strip():
              last -= 1
          previous = last - 1
          while previous >= 0 and not lines[previous].strip():
              previous -= 1
          if previous == last - 1:
              lines.insert(last, '')
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git checkout HEAD^ -- .github/workflows/audit-constructed-language-segments.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Repair final prose formatting'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all paired segments
        run: python3 tools/audit_constructed_language_segments.py
      - uses: actions/upload-artifact@v4
        with:
          name: constructed-language-paired-audit
          path: reports/localization/constructed-language-audit/
          if-no-files-found: error
          retention-days: 14
