name: Audit Constructed-Language Segments

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/audit_constructed_language_segments.py"
      - "localization/sources/tlh/**"
      - "localization/sources/qya/**"
      - ".github/workflows/audit-constructed-language-segments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2
      - name: Apply one-time segment 300 remediation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          review = 'localization/reviews/between-potential-and-ideal/300-science-physics-mathematics-boundary-review.md'
          files = {
              'tlh': Path('localization/sources/tlh/between-potential-and-ideal/300-science-physics-mathematics-boundary.md'),
              'qya': Path('localization/sources/qya/between-potential-and-ideal/300-science-physics-mathematics-boundary.md'),
          }

          def add_metadata(text):
              if 'linguistic_review:' not in text:
                  text = text.replace(
                      'status: draft\n',
                      f'status: draft\nlinguistic_review: specialist-revision-active\nreview_record: {review}\n',
                      1,
                  )
              return text

          tlh = add_metadata(files['tlh'].read_text(encoding='utf-8'))
          replacements = [
              ("Decoration mojmoHbe'taHvIS precision chay' lo'lu'", "Decoration mojmoHbe'taHvIS lughchu'ghach chay' lo'lu'"),
              ('theoryvaD', 'QubmeH mIwvaD'),
              ('theoryvamDaq', 'QubmeH mIwvamDaq'),
              ('shown evidence', "tobmeH De'"),
              ('precision Hemey', "lughchu'ghach Hemey"),
              ('precision decoration', "lughchu'ghach decoration"),
              ('theory tobe', 'QubmeH mIw tobe'),
              ("theory 'ach", "QubmeH mIw 'ach"),
              ('theory ghoj', 'QubmeH mIw ghoj'),
              ('theoryDaq', 'QubmeH mIwDaq'),
              ('vaj theory science', 'vaj QubmeH mIw science'),
              ("science lo'DI' theory,", "science lo'DI' QubmeH mIw,"),
              ('instrument, context, question', 'instrument, qech-ngaS poH, question'),
          ]
          for old, new in replacements:
              tlh = tlh.replace(old, new)
          files['tlh'].write_text(tlh, encoding='utf-8')

          qya = add_metadata(files['qya'].read_text(encoding='utf-8'))
          qya = qya.replace('Capítulo sina', 'Cendë sina')
          qya = qya.replace(
              'instrument, context ar maquetta',
              'instrument, i nómë ar lúmë yassë tana ná cendaina, ar maquetta',
          )
          files['qya'].write_text(qya, encoding='utf-8')
          PY
          git checkout HEAD^ -- .github/workflows/audit-constructed-language-segments.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add .github/workflows/audit-constructed-language-segments.yml \
            localization/sources/tlh/between-potential-and-ideal/300-science-physics-mathematics-boundary.md \
            localization/sources/qya/between-potential-and-ideal/300-science-physics-mathematics-boundary.md
          if ! git diff --cached --quiet; then
            git commit -m 'Remediate segment 300'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all paired segments
        run: python3 tools/audit_constructed_language_segments.py
      - uses: actions/upload-artifact@v4
        with:
          name: constructed-language-paired-audit
          path: reports/localization/constructed-language-audit/
          if-no-files-found: error
          retention-days: 14
