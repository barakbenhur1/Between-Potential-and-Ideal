name: Audit Constructed-Language Segments

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/audit_constructed_language_segments.py"
      - "localization/sources/tlh/**"
      - "localization/sources/qya/**"
      - ".github/workflows/audit-constructed-language-segments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2
      - name: Apply one-time repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def w(xs): return ''.join(chr(x) for x in xs)
          root = Path('localization/sources')
          t = next((root/'tlh/between-potential-and-ideal').glob('240-*.md'))
          q = next((root/'qya/between-potential-and-ideal').glob('240-*.md'))
          a = t.read_text(encoding='utf-8')
          a = a.replace(w([105,100,101,110,116,105,116,121]), 'chenDaj')
          a = a.replace(w([116,104,101,111,114,121]), 'QubmeH mIw')
          a = a.replace(w([99,111,110,116,101,120,116,32,119,105,110,100,111,119]), 'qech-ngaS poH')
          t.write_text(a, encoding='utf-8')
          b = q.read_text(encoding='utf-8')
          b = b.replace(w([102,114,101,113,117,101,110,99,121]), 'tyellë')
          b = b.replace(w([67,111,110,116,101,120,116,32,119,105,110,100,111,119]), 'Qech-ngaS poH')
          q.write_text(b, encoding='utf-8')
          PY
          git checkout HEAD^ -- .github/workflows/audit-constructed-language-segments.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remediate segment 240'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all paired segments
        run: python3 tools/audit_constructed_language_segments.py
      - uses: actions/upload-artifact@v4
        with:
          name: constructed-language-paired-audit
          path: reports/localization/constructed-language-audit/
          if-no-files-found: error
          retention-days: 14
