name: Audit Constructed-Language Segments
on:
  pull_request:
    branches: [main]
    paths:
      - "localization/sources/tlh/**"
      - "localization/sources/qya/**"
      - ".github/workflows/audit-constructed-language-segments.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 3
      - name: Apply pair update
        run: |
          python3 tools/tmp_pair_410.py
          git checkout HEAD~2 -- .github/workflows/audit-constructed-language-segments.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git rm tools/tmp_pair_410.py
          git add .github/workflows/audit-constructed-language-segments.yml localization/sources/tlh/between-potential-and-ideal/410-engineering-maintenance-failure-repair.md localization/sources/qya/between-potential-and-ideal/410-engineering-maintenance-failure-repair.md
          git commit -m 'Update pair 410'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/audit_constructed_language_segments.py
      - uses: actions/upload-artifact@v4
        with:
          name: constructed-language-paired-audit
          path: reports/localization/constructed-language-audit/
          if-no-files-found: error
