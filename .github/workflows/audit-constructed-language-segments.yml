name: Audit Constructed-Language Segments

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/audit_constructed_language_segments.py"
      - "localization/sources/tlh/**"
      - "localization/sources/qya/**"
      - ".github/workflows/audit-constructed-language-segments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2
      - name: Apply prepared source update
        if: github.event_name == 'pull_request'
        run: |
          python3 tools/temp_localization_patch.py
          git checkout HEAD^ -- .github/workflows/audit-constructed-language-segments.yml
          rm tools/temp_localization_patch.py
          git config user.name github-actions
          git config user.email actions@github.com
          git add .github/workflows/audit-constructed-language-segments.yml tools/temp_localization_patch.py localization/sources
          if ! git diff --cached --quiet; then
            git commit -m 'Apply prepared source update'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all paired segments
        run: python3 tools/audit_constructed_language_segments.py
      - uses: actions/upload-artifact@v4
        with:
          name: constructed-language-paired-audit
          path: reports/localization/constructed-language-audit/
          if-no-files-found: error
          retention-days: 14
