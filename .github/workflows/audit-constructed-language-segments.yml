name: Audit Constructed-Language Segments

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/audit_constructed_language_segments.py"
      - "localization/sources/tlh/**"
      - "localization/sources/qya/**"
      - ".github/workflows/audit-constructed-language-segments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2
      - name: Apply one-time segment 310 remediation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          tlh_path = Path('localization/sources/tlh/between-potential-and-ideal/310-locality-nonlocality-bell.md')
          qya_path = Path('localization/sources/qya/between-potential-and-ideal/310-locality-nonlocality-bell.md')

          def add_metadata(text):
              if 'linguistic_review:' not in text:
                  text = text.replace(
                      'status: draft\n',
                      'status: draft\nlinguistic_review: specialist-revision-active\n',
                      1,
                  )
              return text

          tlh = add_metadata(tlh_path.read_text(encoding='utf-8'))
          tlh = re.sub(r'(?<![A-Za-z])context(?![A-Za-z])', 'qech-ngaS poH', tlh)
          tlh = re.sub(r'(?<![A-Za-z])precision(?![A-Za-z])', "lughchu'ghach", tlh)
          tlh = tlh.replace('theoryDaq', 'QubmeH mIwDaq')
          tlh = tlh.replace('theoryvaD', 'QubmeH mIwvaD')
          tlh = re.sub(r'(?<![A-Za-z])theory(?![A-Za-z])', 'QubmeH mIw', tlh)
          tlh_path.write_text(tlh, encoding='utf-8')

          qya = add_metadata(qya_path.read_text(encoding='utf-8'))
          qya = qya.replace(
              'Correlation lá ná message, ar context lá ná noise ara i answer',
              'Correlation lá ná message, ar i conditions i answero lá nar noise',
          )
          qya = qya.replace(
              'measurement, context ar correlations',
              'measurement, i conditions yassen tana ná cendaina, ar correlations',
          )
          qya = qya.replace('truth ú context', 'truth ú i conditions yassë quétina')
          qya = qya.replace('i context yassë works', 'i conditions yassen works')
          qya = qya.replace('mi mana context ar under mana responsibility', 'mi mana conditions ar under mana responsibility')
          qya = re.sub(r'(?<![A-Za-z])capítulo(?![A-Za-z])', 'cendë', qya, flags=re.I)
          qya = re.sub(r'(?<![A-Za-z])channel(?![A-Za-z])', 'tië communicationo', qya)
          qya = re.sub(r'(?<![A-Za-z])context(?![A-Za-z])', 'i conditions yassen tana ná cendaina', qya)
          qya_path.write_text(qya, encoding='utf-8')
          PY
          git checkout HEAD^ -- .github/workflows/audit-constructed-language-segments.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add .github/workflows/audit-constructed-language-segments.yml \
            localization/sources/tlh/between-potential-and-ideal/310-locality-nonlocality-bell.md \
            localization/sources/qya/between-potential-and-ideal/310-locality-nonlocality-bell.md
          if ! git diff --cached --quiet; then
            git commit -m 'Remediate segment 310'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all paired segments
        run: python3 tools/audit_constructed_language_segments.py
      - uses: actions/upload-artifact@v4
        with:
          name: constructed-language-paired-audit
          path: reports/localization/constructed-language-audit/
          if-no-files-found: error
          retention-days: 14
