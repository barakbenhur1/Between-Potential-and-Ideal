name: Build Full Localized Site
on:
  push:
    branches: [main]
    paths:
      - tools/build_localized_public_release.py
      - tools/build_localized_public_release_core.py
      - tools/build_localization_beta.py
      - tools/build_localization_public_packages.py
      - tools/expose_localization_beta.py
      - tools/temporary.txt
      - tools/test_write_small.py
      - tools/tmp_segments_430_450.py
      - tools/a.py
      - .github/workflows/build-full-localized-site.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-full-localized-site
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install --disable-pip-version-check markdown beautifulsoup4 python-docx reportlab
      - name: Rebuild synchronized document packages
        run: python3 tools/build_localization_public_packages.py
      - name: Build complete language sites
        run: python3 tools/build_localized_public_release.py
      - name: Reapply localized entry points without beta banner
        run: python3 tools/expose_localization_beta.py
      - name: Verify localized page parity and four-language menu
        run: |
          set -euo pipefail
          test "$(find site/pages/tlh -maxdepth 1 -name '*.html' | wc -l | tr -d ' ')" = 34
          test "$(find site/pages/qya -maxdepth 1 -name '*.html' | wc -l | tr -d ' ')" = 34
          test -s site/tlh.html
          test -s site/qya.html
          grep -q 'pages/tlh/summary.html' site/tlh.html
          grep -q 'pages/qya/summary.html' site/qya.html
          grep -q 'hero-cta-row' site/tlh.html
          grep -q 'hero-cta-row' site/qya.html
          grep -q 'hreflang="tlh"' site/en.html
          grep -q 'hreflang="qya"' site/index.html
          ! grep -q 'localization-public-beta-links:start' site/index.html
          ! grep -q 'localization-public-beta-links:start' site/en.html
          for page in site/index.html site/en.html; do
            grep -q 'class="bpi-language-menu"' "$page"
            grep -q 'class="bpi-language-menu-icon"' "$page"
            grep -q 'href="/index.html"' "$page"
            grep -q 'href="/en.html"' "$page"
            grep -q 'href="/tlh.html"' "$page"
            grep -q 'href="/qya.html"' "$page"
          done
      - name: Verify synchronized download packages
        run: |
          set -euo pipefail
          test -s localization/site-language-parity-manifest.json
          test -s localization/beta-release-manifest.json
          for lang in tlh qya; do
            for ext in html pdf docx md txt; do
              test -s "site/files/$lang/between-potential-and-ideal-$lang.$ext"
            done
          done
      - name: Reject leaked editorial image notes
        run: |
          set -euo pipefail
          if grep -R -i -E 'image description draft:|visual description draft:|alt text draft:|image prompt draft:' \
            site/pages/tlh site/pages/qya \
            site/files/tlh/between-potential-and-ideal-tlh.html \
            site/files/tlh/between-potential-and-ideal-tlh.md \
            site/files/tlh/between-potential-and-ideal-tlh.txt \
            site/files/qya/between-potential-and-ideal-qya.html \
            site/files/qya/between-potential-and-ideal-qya.md \
            site/files/qya/between-potential-and-ideal-qya.txt; then
            echo 'Editorial image-description draft leaked into a public localized output.' >&2
            exit 1
          fi
      - name: Audit referenced images
        run: python3 tools/audit_images_exist.py
      - name: Upload missing-image report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: localized-missing-image-report
          path: reports/audit_images_exist.json
          if-no-files-found: ignore
      - name: Commit generated sites and packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site localization/config.json localization/translation-manifest.json localization/site-language-parity-manifest.json localization/beta-release-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish four-language globe menu without beta banner"
          git push origin HEAD:main
