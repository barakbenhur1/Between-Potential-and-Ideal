name: run-helper
on: pull_request
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
      - run: python3 tools/temp_localization_patch.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add localization/sources/tlh/between-potential-and-ideal/610-curvature-topology-infinity-multiverse.md localization/sources/qya/between-potential-and-ideal/610-curvature-topology-infinity-multiverse.md
          git commit -m update-source
          git push origin HEAD:localization-release-resolved
