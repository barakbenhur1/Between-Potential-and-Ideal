name: run-helper
on: pull_request
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
      - run: python3 tools/t630.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add localization/sources/tlh/between-potential-and-ideal/630-high-energy-scale-appearance-field-symmetry.md
          git commit -m update-source
          git push origin HEAD:localization-release-resolved
