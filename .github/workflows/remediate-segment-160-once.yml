name: Remediate segment 160 once

on:
  push:
    branches: [localization-release-resolved]
    paths:
      - .github/workflows/remediate-segment-160-once.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-release-resolved
      - name: Apply exact reviewed replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('localization/sources')
          tlh = root / 'tlh/between-potential-and-ideal/160-evil-suffering-goodness-responsibility.md'
          qya = root / 'qya/between-potential-and-ideal/160-evil-suffering-goodness-responsibility.md'

          t = tlh.read_text(encoding='utf-8')
          if t.count('theory') != 4 or t.count('identity') != 1:
              raise SystemExit('Unexpected Klingon source counts')
          t = t.replace('status: draft\n', 'status: draft\nlinguistic_review: specialist-revision-active\nreview_record: localization/reviews/between-potential-and-ideal/160-evil-suffering-goodness-responsibility-review.md\n', 1)
          t = t.replace('theory', 'QubmeH mIw').replace('identity', 'chenDaj')
          tlh.write_text(t, encoding='utf-8')

          q = qya.read_text(encoding='utf-8')
          q = q.replace('status: draft\n', 'status: draft\nlinguistic_review: specialist-revision-active\nreview_record: localization/reviews/between-potential-and-ideal/160-evil-suffering-goodness-responsibility-review.md\n', 1)
          qya.write_text(q, encoding='utf-8')
          PY

          test "$(git hash-object localization/sources/tlh/between-potential-and-ideal/160-evil-suffering-goodness-responsibility.md)" = "cb5553eb31b7bfd367d2a6fcd7fcd7f7838f5be6"
          test "$(git hash-object localization/sources/qya/between-potential-and-ideal/160-evil-suffering-goodness-responsibility.md)" = "ed729c8d2915ed9ad6585c0092185399de4fc5b3"
          rm .github/workflows/remediate-segment-160-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remediate segment 160 paired sources'
          git push origin HEAD:localization-release-resolved
