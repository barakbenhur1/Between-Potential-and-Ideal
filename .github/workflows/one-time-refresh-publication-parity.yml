name: One-time refresh publication parity checksums
on:
  push:
    branches:
      - feature/mongodb-visitor-counter
    paths:
      - .github/workflows/one-time-refresh-publication-parity.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mongodb-visitor-counter
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recalculate only public HTML checksums after analytics insertion
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          files = [
              Path('localization/site-language-parity-manifest.json'),
              Path('localization/beta-release-manifest.json'),
          ]
          expected_token = b'0c5c250fdbbb4c7daa51ac992d260007'
          counts = []
          for manifest_path in files:
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              changes = []
              for entry in manifest['files']:
                  rel = entry['path']
                  eligible = rel in ('site/tlh.html', 'site/qya.html') or (
                      (rel.startswith('site/pages/tlh/') or rel.startswith('site/pages/qya/'))
                      and rel.endswith('.html')
                  )
                  path = Path(rel)
                  if not path.is_file():
                      raise SystemExit(f'Missing required public file: {rel}')
                  data = path.read_bytes()
                  checksum = hashlib.sha256(data).hexdigest()
                  if not eligible:
                      if entry['bytes'] != len(data) or entry['sha256'] != checksum:
                          raise SystemExit(f'Non-HTML or protected package unexpectedly changed: {rel}')
                      continue
                  if b'bpi-cloudflare-web-analytics' not in data or expected_token not in data:
                      raise SystemExit(f'Expected current analytics markup missing: {rel}')
                  if entry['bytes'] != len(data) or entry['sha256'] != checksum:
                      changes.append(rel)
                      entry['bytes'] = len(data)
                      entry['sha256'] = checksum
              if changes:
                  manifest_path.write_text(
                      json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
                      encoding='utf-8',
                  )
              counts.append((str(manifest_path), len(changes)))
          print('Updated checksum entry counts:', counts)
          PY
          python3 tools/check_gateway_pages.py
          python3 tools/audit_extended_localization_parity.py
          git diff --check
      - name: Commit manifest corrections only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/site-language-parity-manifest.json localization/beta-release-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize public-beta HTML manifest checksums with deployed markup"
            git push origin HEAD:feature/mongodb-visitor-counter
          fi
